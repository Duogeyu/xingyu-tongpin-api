<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星遇同频 · 开放接口文档 (API Reference)</title>
  <meta name="description" content="VRChat 中文社区「星遇同频」开放数据（地图榜）与玩家客户端接口交互式文档。" />
  <style>
    :root {
      --xy-bg: #05060a;
      --xy-card: #0c0e16;
      --xy-line: rgba(255, 255, 255, 0.08);
      --xy-text: #eef1f8;
      --xy-muted: #939bb2;
      --xy-gold: #ffd479;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--xy-bg);
      color: var(--xy-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .xy-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 20px;
      background: rgba(5, 6, 10, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--xy-line);
      font-size: 13px;
    }
    .xy-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--xy-text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .xy-brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--xy-gold);
    }
    .xy-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 212, 121, 0.12);
      color: var(--xy-gold);
      border: 1px solid rgba(255, 212, 121, 0.28);
    }
    .xy-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .xy-link {
      color: var(--xy-muted);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .xy-link:hover {
      color: var(--xy-text);
      background: rgba(255, 255, 255, 0.06);
    }
    .xy-link-primary {
      color: #05060a;
      background: var(--xy-gold);
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
    }
    .xy-link-primary:hover {
      color: #05060a;
      background: #ffe099;
    }
    /* Scalar custom dark theme overrides matching #05060a flat design */
    .dark-mode {
      --scalar-background-1: #05060a;
      --scalar-background-2: #0c0e16;
      --scalar-background-3: #131724;
      --scalar-background-accent: rgba(255, 212, 121, 0.08);
      --scalar-border-color: rgba(255, 255, 255, 0.08);
      --scalar-color-1: #eef1f8;
      --scalar-color-2: #b4bcd0;
      --scalar-color-3: #7f88a2;
      --scalar-color-accent: #ffd479;
    }
    @media (max-width: 640px) {
      .xy-topbar { padding: 8px 12px; }
      .xy-hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header class="xy-topbar">
    <a class="xy-brand" href="https://github.com/vrcc-cc/xingyu-tongpin-api">
      <span class="xy-brand-dot"></span>
      <span>星遇同频 · 开放接口</span>
      <span class="xy-badge">v1</span>
    </a>
    <nav class="xy-nav">
      <a class="xy-link xy-hide-sm" href="https://vrcc.cc/match/" target="_blank" rel="noopener">星遇同频主页</a>
      <a class="xy-link xy-hide-sm" href="https://vrcc.cc/maps/" target="_blank" rel="noopener">VRChat 地图榜</a>
      <a class="xy-link" href="https://github.com/vrcc-cc/xingyu-tongpin-vrcx" target="_blank" rel="noopener">VRCX 官方脚本</a>
      <a class="xy-link" href="https://github.com/vrcc-cc/xingyu-tongpin-api" target="_blank" rel="noopener">GitHub 仓库</a>
      <a class="xy-link xy-link-primary" href="https://github.com/vrcc-cc/xingyu-tongpin-api/issues/new?title=%E7%99%BB%E8%AE%B0%E5%AE%A2%E6%88%B7%E7%AB%AF%EF%BC%9A" target="_blank" rel="noopener">登记客户端</a>
    </nav>
  </header>

  <script
    id="api-reference"
    data-url="./openapi.yaml"
    data-configuration='{
      "theme": "kepler",
      "darkMode": true,
      "forceDarkModeState": "dark",
      "hideDarkModeToggle": true,
      "layout": "modern",
      "defaultOpenAllTags": true,
      "showSidebar": true,
      "hideModels": false,
      "authentication": {
        "preferredSecurityScheme": "client",
        "apiKey": {
          "token": "dev-example"
        }
      }
    }'></script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
