openapi: 3.1.0
info:
  title: "星遇同频 · 开放接口 (Open API v1)"
  version: "1.10.1"
  summary: "VRChat 中文社区「星遇同频」开放数据与第三方客户端接口"
  description: |
    [星遇同频](https://vrcc.cc/match/) 的官方开放接口，基础地址为 `https://vrcc.cc/api/v1/`。

    接口分为三类，均只返回网页端本来就公开或属于玩家本人的数据：

    | 类别 | 是否需要令牌 | 适用场景 | 数据范围 |
    | --- | --- | --- | --- |
    | **开放数据 · 地图榜** | 否（仅需 `client` 标识） | VRChat 世界内 Udon 组件、社区网站、群聊机器人 | 与公开的 [地图榜页面](https://vrcc.cc/maps/) 一致（仅含过审地图、均分、评分人数、名次、性能档位，不含评分人与短评） |
    | **玩家个人接口** | 是（`Authorization: Bearer <令牌>`，推荐用设备授权获取） | 桌面端工具（如 [VRCX 脚本](https://github.com/vrcc-cc/xingyu-tongpin-vrcx)、VRCX 分支、Tauri 客户端） | 仅限当前授权玩家本人，按玩家同意的权限（收提醒、看星轨相交与互相连上的星、看星卡、看与打地图评分） |
    | **用星遇同频登录** | 是（OAuth 2.0 授权码 + PKCE，网站自助登记 `client_id`） | 想让玩家「用星遇同频登录」的网站 | 默认仅含该网站专用的玩家编号 `sub` 与星号；按所要权限还可获得验证过的 VRChat 名字与 ID、星卡、地图评分、提醒 |

    ---

    ### 权限（scope）

    每个令牌都带一串权限（空格分隔，也接受逗号或 `+`），只能调用权限内的接口；缺少权限时返回 `403` `{"error": "scope", "need": "<权限>"}`。

    | 权限 | 同意页显示 | 可用接口 | 登记客户端默认 | 敏感 |
    | --- | --- | --- | :---: | :---: |
    | `profile` | 识别你的登录身份，并读取你的星号（没有星号时：识别你的登录身份（专属匿名编号）） | `oauth/userinfo` 的 `sub`、`star` | 总有 | |
    | `vrchat` | 查看你的 VRChat 名字「{名字}」和 ID（没验证时：查看你的 VRChat 名字和 ID（你还没验证，不会提供）） | `oauth/token`、`oauth/userinfo` 的 `vrc` | | ✓ |
    | `card` | 查看你的星卡（星群、介绍和成分） | `GET /me/card` | | |
    | `maps` | 查看你在地图榜的评分和短评 | `GET /me/maps`、`GET /me/maps/{world}` | ✓ | |
    | `maps.rate` | 在你操作时，为地图打分 | `POST /me/maps/{world}/rating`、`…/rating/delete` | ✓ | ✓ |
    | `notifications` | 接收你的星遇同频提醒 | `GET /me/notifications`、`GET /me/notifications/recent` | ✓ | |
    | `crossings` | 查看你的「星轨相交」 | `GET /me/crossings` | ✓ | ✓ |
    | `mutuals` | 查看与你互相连上的星和他们的 VRChat 名字 | `GET /me/mutuals` | ✓ | ✓ |
    | `today` | 查看今天路过你的星（会看到其他玩家的资料） | `GET /me/today` | | ✓ |
    | `inbox` | 查看连向你的星（会看到其他玩家的资料） | `GET /me/inbox` | | ✓ |
    | `link` | 在你操作时，向其他星发起连线 | `POST /me/links` | | ✓ |
    | `chat` | 查看你的私聊（会看到对方发来的消息） | `GET /me/chats`、`GET /me/chats/{n}` | | ✓ |
    | `chat.send` | 在你操作时，发送私聊消息 | `POST /me/chats/{n}` | | ✓ |
    | `posts` | 查看星友圈（会看到其他玩家的动态） | `GET /me/posts` | | ✓ |
    | `posts.write` | 在你操作时，发布星友圈动态 | `POST /me/posts`、评论、点亮、删除、合照 | | ✓ |
    | `photos` | 查看其他玩家的照片（互相连上后才是清晰的） | `GET /me/stars/{n}/photo` | | ✓ |
    | `maps.write` | 在你操作时，写地图介绍、给短评点赞或踩、添加地图 | `POST /me/maps`、`…/intro`、`/me/map-votes` | | ✓ |
    | `safety` | 在你操作时，举报或隐藏其他玩家和内容 | 举报、隐藏、`GET /me/hidden` | | ✓ |

    **敏感权限只给审核过的。** 普通权限（`profile` `card` `maps` `notifications`）都能要；敏感权限：

    - 开 Issue 登记的客户端：全部可要；省略时为 `profile notifications crossings mutuals maps maps.rate`（旧的连接码授权同此）。
    - 审核通过的自助登记应用（`app_…`，网站或客户端）：全部可要，省略时只有 `profile`。网站在 `/oauth/authorize` 的 `scope` 中指定，客户端在 `POST /device/code` 中指定（`X-Client` 填 `client_id`）。
    - 未审核的自助登记应用：敏感权限只有登记人本人的账号能同意（用于开发测试）；其他玩家同意时返回 `403 scope_unreviewed`（取消照常带 `access_denied` 返回）。同意页注明「玩家自行登记，未经星遇同频审核」，玩家的列表中标「未审核」。
    - `dev-` 标识：只能要普通权限，省略时为 `profile notifications maps`（连接码同此）；要敏感权限时 `POST /device/code` 返回 `403 scope_unreviewed`。开发敏感功能请自助登记一个应用，用登记人账号测试。
    - 每次调用都会重新检查：审核被撤回后，敏感接口立即返回 `403 scope_unreviewed`，`/oauth/userinfo` 的 `vrc` 变为 `null`；普通接口照常。
    - 申请审核：「我的资料 → 第三方客户端 → 我登记的应用 → 申请审核」，填写做什么用、源码地址（客户端必须开源）、会怎么用玩家的数据；结果以邮件和站内通知告知；修改已通过的应用会回到未审核。
    - 账号操作（改资料、注销等）不在接口中，以后也不会提供。
    - 同意页列出所要的每一项，顶上写普通权限与敏感权限各几项；敏感权限（`vrchat` `maps.rate` `crossings` `mutuals` `today` `inbox` `link` `chat` `chat.send` `posts` `posts.write` `photos` `maps.write` `safety`）排在前面并标「敏感」；超过三项的先收起，可展开。玩家不能逐项取消：请只要用得到的权限。

    ---

    ### 接入与登记要求

    使用本接口的客户端、世界组件和程序必须遵守以下规则，违反者将被停用标识：

    1. **先登记标识**：开发自测阶段可使用 `dev-` 开头的标识（如 `dev-mywidget`）。正式发布前，请在 [GitHub 仓库](https://github.com/vrcc-cc/xingyu-tongpin-api/issues) 提交标题为「**登记客户端**」的 Issue，写明：**名称、拟定的 `client` 标识、源码或世界地址、调用的接口、用途、联系方式**。核对通过加入白名单后方可正式使用。
    2. **每次请求携带 `client`**：优先使用请求头 `X-Client: <标识>`；无法设置请求头的环境（如 VRChat Udon）可在开放数据接口使用 URL 参数 `?client=<标识>`。
    3. **遵守频率限制**：遇到 `429` 请按回答的 `Retry-After`（秒）等到点再试；开放数据每 5 分钟才更新一次，请做好本地缓存。
    4. **玩家数据安全与透明（调用玩家接口必守）**：
       - **源码公开**：玩家必须能看到你的客户端如何使用令牌。
       - **直连官方**：设备码、连接码与令牌仅保存在玩家本机，只发往 `https://vrcc.cc/api/v1/`，严禁经过任何第三方服务器。
       - **仅给本人看**：严禁转存、上传、汇总或分享玩家数据（尤其是互相连上者的 VRChat 名字）。
       - **写操作手动触发**：打分（`maps.rate`）、连线（`link`）、发私聊（`chat.send`）、发星友圈（`posts.write`）必须由玩家本人每次主动点击触发；严禁自动打分、自动连线、群发私聊或批量发动态。
       - **标明第三方身份**：界面需明确说明并非星遇同频官方客户端，并提供随时可点的「断开连接」按钮。
    5. **用星遇同频登录（网站必守）**：
       - **密钥只放服务器**：`client_secret` 不得出现在网页、App 或代码仓库中；纯前端网站不用密钥，改用 PKCE。
       - **核对 `state`**：回调中的 `state` 与发出的不一致时，不得换取令牌。
       - **用 `sub` 认人**：以 `sub` 作为账号主键，不要用星号或 VRChat 名字。
       - **说明用途**：在网站上写明拿到的星号、VRChat 名字与 ID 的用途。
       - **不冒充官方**：网站名称与页面不得让人误以为是星遇同频官方。
       - **只要用得到的权限**：同意页会列出每一项（敏感权限排前并标出），玩家只能整体同意或拒绝。
       - **敏感权限先过审核**：申请时写明的用途、源码（客户端必须开源）与数据用法须与实际一致。

    ---

    ### 跨域（CORS）与调用环境

    - **原生程序 / 脚本**（Node.js、Rust、Python、C#、VRChat Udon 等）：直接发起请求，不受浏览器同源策略限制。
    - **桌面客户端内置页面**（如 Tauri）：仅允许 `tauri://localhost`、`http(s)://tauri.localhost`、`null`（本地文件页面）以及开发时的 `http://localhost` / `http://127.0.0.1` 读取响应；普通外部网站无法跨域调用。
    - **`/oauth/token` 与 `/oauth/userinfo`**：允许任何来源跨域调用（`Access-Control-Allow-Origin: *`），且不需要 `X-Client`。
    - **网站调用 `/me/…`**：普通网站的网页跨域读不到，请从网站服务器发起，`X-Client` 填网站的 `client_id`。
  contact:
    name: "GitHub Issues (登记客户端 / 问题反馈)"
    url: "https://github.com/vrcc-cc/xingyu-tongpin-api/issues"
  license:
    name: "MIT（文档与示例）；开放数据需注明「数据来自星遇同频地图榜（vrcc.cc）」"
    url: "https://github.com/vrcc-cc/xingyu-tongpin-api/blob/main/LICENSE"

servers:
  - url: "https://vrcc.cc/api/v1"
    description: "星遇同频正式环境"

tags:
  - name: "开放数据 · 地图榜"
    description: |
      所有人可见的地图榜公开数据，无需登录令牌。每次请求需携带 `X-Client` 请求头（或在 URL 中附加 `?client=`，方便 VRChat Udon `VRCStringDownloader` 调用）。
      服务器边缘缓存最长 5 分钟更新一次。
  - name: "贴纸素材"
    description: |
      星卡上的贴纸，照网页的样子画。不用 `client`、不用令牌。只用来显示玩家星卡上的贴纸，不要当应用图标、表情包或单独售卖。
  - name: "连接与授权"
    description: |
      **推荐：设备授权（RFC 8628）。** 客户端调用 `POST /device/code` 拿到给玩家看的 `user_code` 与同意链接 `verification_uri_complete`；玩家在浏览器里看到客户端名字和所要的权限后点「同意连接」；客户端每 `interval` 秒调用 `POST /device/token`，同意后拿到 48 位十六进制访问令牌。
      **旧方式（仍可用）**：玩家在网页端「我的资料 → 在 VRCX 里提醒」获取 8 位一次性连接码，客户端调用 `POST /connect` 换取令牌。

      客户端用 `scope` 指定要的权限（省略时：开 Issue 登记的客户端为 `profile notifications crossings mutuals maps maps.rate`，`dev-` 为 `profile notifications maps`，自助登记的应用为 `profile`），同意页列出每一项（敏感权限排前并标出）。敏感权限只给开 Issue 登记的客户端与审核通过的自助登记应用；未审核的应用只有登记人本人的账号能同意敏感权限（用于开发测试），其他玩家同意时返回 `403 scope_unreviewed`；`dev-` 标识只能要普通权限。

      **每个客户端有自己的授权**，不会顶掉玩家 VRCX 脚本或别的客户端的连接。同一客户端、同一玩家只有一个授权（再次授权会让这个客户端之前的令牌失效）；每位玩家最多 10 个（第三方客户端与登录过的网站合计，超出时删除最久未使用的）。90 天没有调用过任何接口的授权会自动断开，之后返回 `404 gone`。玩家可在「我的资料 → 第三方客户端」查看并单独断开。
  - name: "用星遇同频登录"
    description: |
      OAuth 2.0 授权码流程（RFC 6749）+ PKCE（RFC 7636，仅 `S256`），供网站实现「用星遇同频登录」。

      1. **登记应用**：登录星遇同频后在「我的资料 → 第三方客户端 → 开发者 → 我登记的应用」自助登记（一次登记可以是网站，也可以是桌面客户端）：名称（2–20 字，不得含「星遇同频」「VRCC」「VRChat」「官方」「管理员」）、网站地址（https）、0–5 个回调地址（不填则只能走设备授权，不能用星遇同频登录；https，或本机调试用 `http://localhost` / `http://127.0.0.1`；不得含 `#`；按 URL 规范化后精确匹配，如 `https://a.com` 存为 `https://a.com/`）。获得 `client_id`（`app_` + 16 位十六进制）与 `client_secret`（`sec_` + 48 位十六进制，仅显示一次，可重新生成，旧密钥立即失效）。每人最多 5 个。登记后即可使用普通权限；敏感权限需在「我登记的应用」申请审核（做什么用、源码地址、会怎么用玩家的数据），结果以邮件和站内通知告知，修改已通过的应用会回到未审核。审核通过前敏感权限只有登记人本人能同意。未审核的应用同意页会提示玩家；管理员可停用违规应用。
      2. **跳转授权**：浏览器打开 `https://vrcc.cc/oauth/authorize?response_type=code&client_id=app_…&redirect_uri=…&state=…&code_challenge=…&code_challenge_method=S256`。玩家（未登录时先登录）看到网站名、「登录后回到 <域名>」、所要的每一项权限以及「这个网站由玩家自行登记，未经星遇同频审核。请只在你信任的网站登录。」，点「继续」或「取消」。
         - 继续：回到 `redirect_uri?code=<48 位十六进制>&state=…`（`code` 5 分钟内有效，只能用一次）；
         - 取消：回到 `redirect_uri?error=access_denied&state=…`；
         - `client_id` 未登记 / 已停用、`redirect_uri` 未登记：**不会跳回网站**，错误只显示在星遇同频页面上。
         - 未审核的网站要了敏感权限、且登录的不是登记人：点「继续」被拒（`scope_unreviewed`，只显示在星遇同频页面上），点「取消」照常带 `access_denied` 返回。
         - PKCE：不用密钥的网站必须带 `code_challenge`（SHA-256 后 base64url，43 个字符）；用密钥的服务器网站可选，建议也带。
      3. **换令牌**：`POST /oauth/token`。
      4. **查询玩家**：`GET /oauth/userinfo`。
      5. **调用玩家个人接口（可选）**：要了其他权限的网站，可从服务器带 `Authorization: Bearer <access_token>` 与 `X-Client: <client_id>` 调用对应的 `/me/…` 接口。网站登记期间 `client_id`（`app_…`）可当作 `X-Client`（或 `?client=`）用于所有 `/api/v1` 接口（含开放数据）；未登记或已删除的返回 `403 client_unknown`。令牌只能配自己的 `client_id` 使用，`X-Client` 不一致返回 `403 client_mismatch`。
      6. **设备授权（可选）**：网站也可以用 `client_id` 当 `X-Client` 走设备授权（`POST /device/code`），省略 `scope` 时只有 `profile`，敏感权限需审核（审核前只有登记人能同意）；同意页显示登记的名称与「玩家自行登记，未经星遇同频审核」。

      授权时用 `scope` 指定权限，省略时只有 `profile`；要了不认识的权限，错误只显示在星遇同频页面上，**不会跳回网站**。所有年龄（16 岁以上）的玩家都可使用。
  - name: "玩家个人数据"
    description: |
      需同时携带 `X-Client: <标识>` 与 `Authorization: Bearer <令牌>` 请求头（令牌严禁放入 URL），且令牌须有对应权限（否则 `403 scope`）。
      用于拉取实时提醒、查看星轨相交与互相连上的星友、查看星卡与地图评分、给当前所在的 VRChat 地图打分。
  - name: "网页上的动作"
    description: |
      今天的星、连向我、连线、私聊、星友圈：与网页执行同一个动作，网页的规则与上限原样适用（只能连今天这一轮等网页允许的星、只能和互相连上的人私聊、发言检查、16–17 岁与 18 岁以上分开等），回答与网页相同。这里列出主要字段：没列出的是网页自己用的，可能变化或去掉，不要依赖。完整示例见仓库的 examples/responses.json。

      每个令牌另有每天的上限：本组读接口合计 1000 次、连线 20 次、私聊 100 条、发星友圈 5 条，超出返回 `429 too_many`。

      对方不在了（连线、私聊的那颗星走了）返回 `404 star_gone`；`404 gone` 只表示令牌失效。

      **写接口（连线、发私聊、发星友圈）只能在玩家本人每次主动点击时调用，严禁自动连线、群发私聊或批量发动态。**

security:
  - client: []

paths:
  /boards/maps:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "获取地图榜排行"
      operationId: getMapsBoard
      description: |
        返回已通过审核且**有评分**的上榜地图，按总榜名次从高到低排列。名次按排名分：`(3 × 7 + Σ 权重 × 分) ÷ (3 + Σ 权重)`（权重：去过 1、验证了 VRChat 0.75、其他 0.5、地图作者自己 0），同分评分人数多的在前；`avg` 是普通平均分，所以 `avg` 高的图可能排在 `avg` 低的后面。
        适合用于 VRChat 世界内的排行榜展板、社区网站或机器人。
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: limit
          in: query
          description: "返回条数（1–100，默认 20）"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用，例如 VRChat Udon）"
          schema:
            type: string
            example: "dev-mywidget"
      responses:
        '200':
          description: "成功返回地图榜排行"
          content:
            application/json:
              schema:
                type: object
                required: [board, min, at, maps]
                properties:
                  board:
                    type: string
                    const: "maps"
                    description: "榜单标识"
                  min:
                    type: integer
                    description: "有名次所需的最少评分人数"
                    example: 1
                  at:
                    type: integer
                    description: "榜单快照生成时间（毫秒时间戳）"
                    example: 1792830000000
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardMap"
              examples:
                default:
                  summary: "地图榜前 2 名示例"
                  value:
                    board: "maps"
                    min: 1
                    at: 1792830000000
                    maps:
                      - world: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
                        name: "星夜茶屋 Starry Tea House"
                        author: "Shiori"
                        avg: 9.2
                        raters: 18
                        rank: 1
                        weight: "light"
                        page: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
                        img: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd.jpg"
                      - world: "wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
                        name: "琥珀海岸 Amber Coast"
                        author: "Kaze"
                        avg: 8.8
                        raters: 9
                        rank: 2
                        weight: "mid"
                        page: "https://vrcc.cc/maps/wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
                        img: "https://vrcc.cc/maps/wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088.jpg"
        '403':
          $ref: "#/components/responses/ClientError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /maps:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "批量查询多张地图"
      operationId: getMapsByIds
      description: |
        按逗号分隔的 VRChat 世界 ID（`wrld_…`）批量查询地图信息，**一次最多 20 张**。
        响应中只包含已在地图榜上通过审核的地图（未上榜的不出现在 `maps` 数组中，还没人评分的 `rank` 为 `null`）。
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: ids
          in: query
          required: true
          description: "逗号分隔的地图 ID（wrld_…），最多 20 个"
          schema:
            type: string
            example: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd,wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用）"
          schema:
            type: string
      responses:
        '200':
          description: "成功返回在榜上的地图列表"
          content:
            application/json:
              schema:
                type: object
                required: [at, maps]
                properties:
                  at:
                    type: integer
                    description: "榜单快照时间（毫秒时间戳）"
                    example: 1792830000000
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardMap"
        '400':
          description: "参数格式不对或超过 20 个 ID（bad_request）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "bad_request"
        '403':
          $ref: "#/components/responses/ClientError"
        default:
          $ref: "#/components/responses/Error"

  /maps/{world}:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "查询单张地图"
      operationId: getMapById
      description: "查询指定 VRChat 世界 ID 在地图榜上的公开信息。如果该地图不在榜上或未过审，返回 `404 not_found`。"
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: world
          in: path
          required: true
          description: "VRChat 世界 ID（仅 wrld_…，不含房间实例号）"
          schema:
            $ref: "#/components/schemas/World"
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用）"
          schema:
            type: string
      responses:
        '200':
          description: "该地图在榜上"
          content:
            application/json:
              schema:
                type: object
                required: [at, map]
                properties:
                  at:
                    type: integer
                    example: 1792830000000
                  map:
                    $ref: "#/components/schemas/BoardMap"
        '404':
          description: "地图不在榜上（not_found）"
