  /me/maps/{world}/rating:
    post:
      tags: ["玩家个人数据"]
      summary: "给当前所在的地图打分与写短评"
      operationId: rateMyMap
      description: |
        **需要权限 `maps.rate`。**

        为玩家当前所在的地图打分（1–10 分），可选附带一句不超过 30 字的短评。
        - **必须由玩家本人主动点击触发**，严禁自动打分或批量打分。
        - `text` 处理规则：
          - 传入非空字符串：提交或更新短评（会经过与网页端相同的关键词与 AI 审核）；
          - 传入空字符串 `""`：删除已有的短评；
          - **不传 `text` 字段**：仅修改分数，保留原有短评不变。
        - 若该地图尚未收录进地图榜，首次打分会自动以该玩家为添加者提交收录。
      security:
        - client: []
          token: []
      parameters:
        - name: world
          in: path
          required: true
          description: "玩家当前所在的地图 ID（仅 wrld_…）"
          schema:
            $ref: "#/components/schemas/World"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: "评分（1–10 的整数）"
                  example: 9
                text:
                  type: string
                  maxLength: 30
                  description: "一句短评（最多 30 字；传空字符串删除短评；省略则只改分数）"
                  example: "光影很舒服，适合安静聊天"
      responses:
        '200':
          description: "打分成功，返回更新后的地图状态（同 GET /me/maps/{world}）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMap"
        '400':
          description: |
            参数或短评未通过检查：
            - `yq_words`：短评含违规词或包含自己的 VRChat 名字（`why` 字段说明具体原因）
            - `yq_empty`：短评仅包含标点符号或空白
            - `bad_request`：分数不在 1–10 之间或 `world` 格式错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "yq_words"
                why: "请不要在短评里留联系方式"
        '403':
          description: |
            当前不允许打分：
            - `scope`：令牌没有 `maps.rate` 权限（附带 `need`）
            - `client_mismatch`：令牌不是发给这个 `X-Client` 的
            - `map_off` / `xd_world_no`：该地图已关闭评分或不对当前玩家开放
            - （`map_not_went`、`map_elsewhere` 从 2026-10-24 起不再返回：谁都能打分）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "map_off"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

