        只有星友圈动态的配图和合照，不提供玩家星卡上的照片。
      parameters:
        - { name: id, in: path, required: true, description: "动态的 id", schema: { type: integer } }
        - { name: client, in: query, required: true, schema: { type: string } }
        - { name: g, in: query, required: true, description: "授权编号（签名的一部分）", schema: { type: integer } }
        - { name: exp, in: query, required: true, description: "过期时间（毫秒）", schema: { type: integer } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
