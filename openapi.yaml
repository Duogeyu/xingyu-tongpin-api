openapi: 3.1.0
info:
  title: "星遇同频 · 开放接口 (Open API v1)"
  version: "1.2.0"
  summary: "VRChat 中文社区「星遇同频」开放数据与第三方客户端接口"
  description: |
    [星遇同频](https://vrcc.cc/match/) 的官方开放接口，基础地址为 `https://vrcc.cc/api/v1/`。

    接口分为三类，均只返回网页端本来就公开或属于玩家本人的数据：

    | 类别 | 是否需要令牌 | 适用场景 | 数据范围 |
    | --- | --- | --- | --- |
    | **开放数据 · 地图榜** | 否（仅需 `client` 标识） | VRChat 世界内 Udon 组件、社区网站、群聊机器人 | 与公开的 [地图榜页面](https://vrcc.cc/maps/) 一致（仅含过审地图、均分、评分人数、名次、性能档位，不含评分人与短评） |
    | **玩家个人接口** | 是（`Authorization: Bearer <令牌>`，推荐用设备授权获取） | 桌面端工具（如 [VRCX 脚本](https://github.com/vrcc-cc/xingyu-tongpin-vrcx)、VRCX 分支、Tauri 客户端） | 仅限当前授权玩家本人，按玩家同意的权限（收提醒、看星轨相交与互相连上的星、看星卡、看与打地图评分） |
    | **用星遇同频登录** | 是（OAuth 2.0 授权码 + PKCE，网站自助登记 `client_id`） | 想让玩家「用星遇同频登录」的网站 | 默认仅含该网站专用的玩家编号 `sub` 与星号；按所要权限还可获得验证过的 VRChat 名字与 ID、星卡、地图评分、提醒 |

    ---

    ### 权限（scope）

    每个令牌都带一串权限（空格分隔，也接受逗号或 `+`），只能调用权限内的接口；缺少权限时返回 `403` `{"error": "scope", "need": "<权限>"}`。

    | 权限 | 同意页显示 | 可用接口 | 客户端默认 | 网站可要 |
    | --- | --- | --- | :---: | :---: |
    | `profile` | 识别你的登录身份，并读取你的星号 {星号}（没有星号时：识别你的登录身份（专属匿名编号）） | `oauth/userinfo` 的 `sub`、`star` | 总有 | 总有 |
    | `vrchat` | 查看你的 VRChat 名字「{名字}」和 ID（没验证时：查看你的 VRChat 名字和 ID（你还没验证，不会提供）） | `oauth/token`、`oauth/userinfo` 的 `vrc` | | ✓ |
    | `card` | 查看你的星卡（星群、介绍和成分） | `GET /me/card` | | ✓ |
    | `maps` | 查看你在地图榜的评分和短评 | `GET /me/maps`、`GET /me/maps/{world}` | ✓ | ✓ |
    | `maps.rate` | 在你操作时，为你去过的地图打分 | `POST /me/maps/{world}/rating` | ✓ | ✓ |
    | `notifications` | 接收你的星遇同频提醒 | `GET /me/notifications`、`GET /me/notifications/recent` | ✓ | ✓ |
    | `crossings` | 查看你的「星轨相交」 | `GET /me/crossings` | ✓ | |
    | `mutuals` | 查看与你互相连上的星和他们的 VRChat 名字 | `GET /me/mutuals` | ✓ | |

    - 桌面客户端在 `POST /device/code` 的 `scope` 中指定，8 项均可；省略时为 `profile notifications crossings mutuals maps maps.rate`（旧的连接码授权同此）。
    - 网站在 `/oauth/authorize` 的 `scope` 中指定；省略时只有 `profile`；不能要 `crossings`、`mutuals`（其中是其他玩家的名字与 VRChat 账号，他们没有同意过，网站也未经审核）。
    - 同意页把所要的每一项列成一行，不折叠，也不能逐项取消：请只要用得到的权限。

    ---

    ### 接入与登记要求

    使用本接口的客户端、世界组件和程序必须遵守以下规则，违反者将被停用标识：

    1. **先登记标识**：开发自测阶段可使用 `dev-` 开头的标识（如 `dev-mywidget`）。正式发布前，请在 [GitHub 仓库](https://github.com/vrcc-cc/xingyu-tongpin-api/issues) 提交标题为「**登记客户端**」的 Issue，写明：**名称、拟定的 `client` 标识、源码或世界地址、调用的接口、用途、联系方式**。核对通过加入白名单后方可正式使用。
    2. **每次请求携带 `client`**：优先使用请求头 `X-Client: <标识>`；无法设置请求头的环境（如 VRChat Udon）可在开放数据接口使用 URL 参数 `?client=<标识>`。
    3. **遵守频率限制**：遇到 `429` 请至少等待 60 秒再试；开放数据每 5 分钟才更新一次，请做好本地缓存。
    4. **玩家数据安全与透明（调用玩家接口必守）**：
       - **源码公开**：玩家必须能看到你的客户端如何使用令牌。
       - **直连官方**：设备码、连接码与令牌仅保存在玩家本机，只发往 `https://vrcc.cc/api/v1/`，严禁经过任何第三方服务器。
       - **仅给本人看**：严禁转存、上传、汇总或分享玩家数据（尤其是互相连上者的 VRChat 名字）。
       - **手动打分**：地图打分必须由玩家本人主动点击触发，严禁自动或批量打分。
       - **标明第三方身份**：界面需明确说明并非星遇同频官方客户端，并提供随时可点的「断开连接」按钮。
    5. **用星遇同频登录（网站必守）**：
       - **密钥只放服务器**：`client_secret` 不得出现在网页、App 或代码仓库中；纯前端网站不用密钥，改用 PKCE。
       - **核对 `state`**：回调中的 `state` 与发出的不一致时，不得换取令牌。
       - **用 `sub` 认人**：以 `sub` 作为账号主键，不要用星号或 VRChat 名字。
       - **说明用途**：在网站上写明拿到的星号、VRChat 名字与 ID 的用途。
       - **不冒充官方**：网站名称与页面不得让人误以为是星遇同频官方。
       - **只要用得到的权限**：同意页会逐项列出，玩家只能整体同意或拒绝。

    ---

    ### 跨域（CORS）与调用环境

    - **原生程序 / 脚本**（Node.js、Rust、Python、C#、VRChat Udon 等）：直接发起请求，不受浏览器同源策略限制。
    - **桌面客户端内置页面**（如 Tauri）：仅允许 `tauri://localhost`、`http(s)://tauri.localhost`、`null`（本地文件页面）以及开发时的 `http://localhost` / `http://127.0.0.1` 读取响应；普通外部网站无法跨域调用。
    - **`/oauth/token` 与 `/oauth/userinfo`**：允许任何来源跨域调用（`Access-Control-Allow-Origin: *`），且不需要 `X-Client`。
    - **网站调用 `/me/…`**：普通网站的网页跨域读不到，请从网站服务器发起，`X-Client` 填网站的 `client_id`。
  contact:
    name: "GitHub Issues (登记客户端 / 问题反馈)"
    url: "https://github.com/vrcc-cc/xingyu-tongpin-api/issues"
  license:
    name: "MIT（文档与示例）；开放数据需注明「数据来自星遇同频地图榜（vrcc.cc）」"
    url: "https://github.com/vrcc-cc/xingyu-tongpin-api/blob/main/LICENSE"

servers:
  - url: "https://vrcc.cc/api/v1"
    description: "星遇同频正式环境"

tags:
  - name: "开放数据 · 地图榜"
    description: |
      所有人可见的地图榜公开数据，无需登录令牌。每次请求需携带 `X-Client` 请求头（或在 URL 中附加 `?client=`，方便 VRChat Udon `VRCStringDownloader` 调用）。
      服务器边缘缓存最长 5 分钟更新一次。
  - name: "连接与授权"
    description: |
      **推荐：设备授权（RFC 8628）。** 客户端调用 `POST /device/code` 拿到给玩家看的 `user_code` 与同意链接 `verification_uri_complete`；玩家在浏览器里看到客户端名字和所要的权限后点「同意连接」；客户端每 `interval` 秒调用 `POST /device/token`，同意后拿到 48 位十六进制访问令牌。
      **旧方式（仍可用）**：玩家在网页端「我的资料 → 在 VRCX 里提醒」获取 8 位一次性连接码，客户端调用 `POST /connect` 换取令牌。

      客户端用 `scope` 指定要的权限（省略时为 `profile notifications crossings mutuals maps maps.rate`），同意页逐项列出。

      **每个客户端有自己的授权**，不会顶掉玩家 VRCX 脚本或别的客户端的连接。同一客户端、同一玩家只有一个授权（再次授权会让这个客户端之前的令牌失效）；每位玩家最多 10 个（第三方客户端与登录过的网站合计，超出时删除最久未使用的）。玩家可在「我的资料 → 第三方客户端」查看并单独断开。
  - name: "用星遇同频登录"
    description: |
      OAuth 2.0 授权码流程（RFC 6749）+ PKCE（RFC 7636，仅 `S256`），供网站实现「用星遇同频登录」。

      1. **登记网站**：登录星遇同频后在「我的资料 → 第三方客户端 → 开发者 → 我登记的网站」自助登记：网站名称（2–20 字，不得含「星遇同频」「VRCC」「VRChat」「官方」「管理员」）、网站地址（https）、1–5 个回调地址（https，或本机调试用 `http://localhost` / `http://127.0.0.1`；不得含 `#`；按 URL 规范化后精确匹配，如 `https://a.com` 存为 `https://a.com/`）。获得 `client_id`（`app_` + 16 位十六进制）与 `client_secret`（`sec_` + 48 位十六进制，仅显示一次，可重新生成，旧密钥立即失效）。每人最多 5 个网站。网站不经事先审核，同意页会提示玩家；管理员可停用违规网站。
      2. **跳转授权**：浏览器打开 `https://vrcc.cc/oauth/authorize?response_type=code&client_id=app_…&redirect_uri=…&state=…&code_challenge=…&code_challenge_method=S256`。玩家（未登录时先登录）看到网站名、「登录后回到 <域名>」、网站会拿到的信息以及「这个网站由玩家自己登记，星遇同频没有审核」，点「继续」或「取消」。
         - 继续：回到 `redirect_uri?code=<48 位十六进制>&state=…`（`code` 5 分钟内有效，只能用一次）；
         - 取消：回到 `redirect_uri?error=access_denied&state=…`；
         - `client_id` 未登记 / 已停用、`redirect_uri` 未登记：**不会跳回网站**，错误只显示在星遇同频页面上。
         - PKCE：不用密钥的网站必须带 `code_challenge`（SHA-256 后 base64url，43 个字符）；用密钥的服务器网站可选，建议也带。
      3. **换令牌**：`POST /oauth/token`。
      4. **查询玩家**：`GET /oauth/userinfo`。
      5. **调用玩家个人接口（可选）**：要了 `card`、`maps`、`maps.rate`、`notifications` 的网站，可从服务器带 `Authorization: Bearer <access_token>` 与 `X-Client: <client_id>` 调用对应的 `/me/…` 接口。网站登记期间 `client_id`（`app_…`）可当作 `X-Client`（或 `?client=`）用于所有 `/api/v1` 接口（含开放数据）；未登记或已删除的返回 `403 client_unknown`。令牌只能配自己的 `client_id` 使用，`X-Client` 不一致返回 `403 client_mismatch`。
      6. **设备授权（可选）**：网站也可以用 `client_id` 当 `X-Client` 走设备授权（`POST /device/code`），权限上限与登录相同：省略时只有 `profile`，最多 `profile vrchat card maps maps.rate notifications`，要 `crossings` / `mutuals` 返回 `400 invalid_scope`；同意页显示网站登记的名称。

      授权时用 `scope` 指定权限，省略时只有 `profile`，最多 `profile vrchat card maps maps.rate notifications`；要了不能要或不认识的权限，错误只显示在星遇同频页面上，**不会跳回网站**。所有年龄（16 岁以上）的玩家都可使用。
  - name: "玩家个人数据"
    description: |
      需同时携带 `X-Client: <标识>` 与 `Authorization: Bearer <令牌>` 请求头（令牌严禁放入 URL），且令牌须有对应权限（否则 `403 scope`）。
      用于拉取实时提醒、查看星轨相交与互相连上的星友、查看星卡与地图评分、给当前所在的 VRChat 地图打分。

security:
  - client: []

paths:
  /boards/maps:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "获取地图榜排行"
      operationId: getMapsBoard
      description: |
        返回已通过审核且**满 5 人评分**的上榜地图，按总榜名次从高到低排列。
        适合用于 VRChat 世界内的排行榜展板、社区网站或机器人。
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: limit
          in: query
          description: "返回条数（1–100，默认 20）"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用，例如 VRChat Udon）"
          schema:
            type: string
            example: "dev-mywidget"
      responses:
        '200':
          description: "成功返回地图榜排行"
          content:
            application/json:
              schema:
                type: object
                required: [board, min, at, maps]
                properties:
                  board:
                    type: string
                    const: "maps"
                    description: "榜单标识"
                  min:
                    type: integer
                    description: "上总榜所需的最少评分人数"
                    example: 5
                  at:
                    type: integer
                    description: "榜单快照生成时间（毫秒时间戳）"
                    example: 1792830000000
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardMap"
              examples:
                default:
                  summary: "地图榜前 2 名示例"
                  value:
                    board: "maps"
                    min: 5
                    at: 1792830000000
                    maps:
                      - world: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
                        name: "星夜茶屋 Starry Tea House"
                        author: "Shiori"
                        avg: 9.2
                        raters: 18
                        rank: 1
                        weight: "light"
                        page: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
                        img: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd.jpg"
                      - world: "wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
                        name: "琥珀海岸 Amber Coast"
                        author: "Kaze"
                        avg: 8.8
                        raters: 9
                        rank: 2
                        weight: "mid"
                        page: "https://vrcc.cc/maps/wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
                        img: "https://vrcc.cc/maps/wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088.jpg"
        '403':
          $ref: "#/components/responses/ClientError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /maps:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "批量查询多张地图"
      operationId: getMapsByIds
      description: |
        按逗号分隔的 VRChat 世界 ID（`wrld_…`）批量查询地图信息，**一次最多 20 张**。
        响应中只包含已在地图榜上通过审核的地图（未上榜的不出现在 `maps` 数组中，若评分不满 5 人则 `rank` 为 `null`）。
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: ids
          in: query
          required: true
          description: "逗号分隔的地图 ID（wrld_…），最多 20 个"
          schema:
            type: string
            example: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd,wrld_791ebf58-54ce-4d3a-a0a0-39f10f1b2088"
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用）"
          schema:
            type: string
      responses:
        '200':
          description: "成功返回在榜上的地图列表"
          content:
            application/json:
              schema:
                type: object
                required: [at, maps]
                properties:
                  at:
                    type: integer
                    description: "榜单快照时间（毫秒时间戳）"
                    example: 1792830000000
                  maps:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardMap"
        '400':
          description: "参数格式不对或超过 20 个 ID（bad_request）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "bad_request"
        '403':
          $ref: "#/components/responses/ClientError"
        default:
          $ref: "#/components/responses/Error"

  /maps/{world}:
    get:
      tags: ["开放数据 · 地图榜"]
      summary: "查询单张地图"
      operationId: getMapById
      description: "查询指定 VRChat 世界 ID 在地图榜上的公开信息。如果该地图不在榜上或未过审，返回 `404 not_found`。"
      security:
        - client: []
        - clientQuery: []
      parameters:
        - name: world
          in: path
          required: true
          description: "VRChat 世界 ID（仅 wrld_…，不含房间实例号）"
          schema:
            $ref: "#/components/schemas/World"
        - name: client
          in: query
          description: "客户端标识（仅在无法发送 X-Client 请求头时使用）"
          schema:
            type: string
      responses:
        '200':
          description: "该地图在榜上"
          content:
            application/json:
              schema:
                type: object
                required: [at, map]
                properties:
                  at:
                    type: integer
                    example: 1792830000000
                  map:
                    $ref: "#/components/schemas/BoardMap"
        '404':
          description: "地图不在榜上（not_found）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "not_found"
        default:
          $ref: "#/components/responses/Error"

  /device/code:
    post:
      tags: ["连接与授权"]
      summary: "设备授权：获取设备码与同意链接（推荐）"
      operationId: deviceCode
      description: |
        设备授权（RFC 8628）第一步。请求体可省略；需要指定权限时带 `scope`（省略时为 `profile notifications crossings mutuals maps maps.rate`，`profile` 总会加上）。

        登记过的网站（`X-Client` 为 `app_…`）也可使用，但权限上限与「用星遇同频登录」相同：省略时只有 `profile`，最多 `profile vrchat card maps maps.rate notifications`。

        - 客户端向玩家显示 `user_code`，并在浏览器中打开 `verification_uri_complete`（码已包含在链接中）；玩家也可以在「我的资料 → 第三方客户端」手动输入 `user_code`。
        - 玩家需已登录星遇同频，会看到客户端名字（未登记的 `dev-` 标识显示「（测试中）」与「还没登记，只在测试」；网站显示其登记的名称）及所要的每一项权限（列在「连接后，它可以：」下面，一项一行），再点「同意连接」或「取消」。
        - `device_code` 仅由客户端保存，用于调用 `POST /device/token`，不要展示给玩家。
        - `scope` 中有不认识的权限，或网站要了 `crossings` / `mutuals`：`400 invalid_scope`。
        - 限制：每个网络地址每天最多获取 30 个（超限返回 `429 too_many`）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  $ref: "#/components/schemas/Scope"
            example:
              scope: "notifications maps maps.rate"
      responses:
        '200':
          description: "设备码与同意链接"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        '400':
          description: "scope 中有不认识的权限，或网站要了网站不能要的权限（invalid_scope）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_scope"
        '403':
          $ref: "#/components/responses/ClientError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /device/token:
    post:
      tags: ["连接与授权"]
      summary: "设备授权：轮询换取访问令牌"
      operationId: deviceToken
      description: |
        设备授权第二步：每隔 `interval` 秒（5 秒）调用一次，**不要更快**；`X-Client` 必须与获取设备码时相同。拿到的令牌之后也只能配这个 `X-Client` 使用（否则 `403 client_mismatch`）。

        - 等待中：`400 authorization_pending`，继续等待；
        - 玩家点了「取消」：`400 access_denied`，停止；
        - 过期（10 分钟）、已换过令牌、客户端不一致或设备码不存在：`400 expired_token`，停止，需要时重新获取设备码；
        - 玩家同意后：`200`，返回令牌（**只返回这一次**，之后再问是 `expired_token`）。

        同一客户端再次为同一玩家授权，会让该客户端之前的令牌失效；不会影响 VRCX 脚本或其他客户端。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
                  pattern: "^[0-9a-f]{48}$"
                  description: "POST /device/code 返回的 device_code"
                  example: "9f2c4e1a7b3d5f6081726354a0b1c2d3e4f5a6b7c8d9e0f1"
      responses:
        '200':
          description: "玩家已同意，返回访问令牌（仅一次）"
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope, me]
                properties:
                  access_token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，仅保存在玩家本机，后续请求放入 Authorization: Bearer <access_token>"
                    example: "a1b2c3d4e5f60123456789abcdef0123456789abcdef0123"
                  token_type:
                    type: string
                    const: "Bearer"
                  scope:
                    $ref: "#/components/schemas/Scope"
                  me:
                    allOf:
                      - $ref: "#/components/schemas/Me"
                    description: "me.vrc 只在有 vrchat 权限时返回，否则为 null"
        '400':
          description: |
            尚未拿到令牌：
            - `authorization_pending`：玩家还没点，过 `interval` 秒再问
            - `access_denied`：玩家点了「取消」
            - `expired_token`：已过期、已换过、客户端不一致或设备码不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                pending:
                  summary: "等待玩家同意"
                  value:
                    error: "authorization_pending"
                denied:
                  summary: "玩家点了取消"
                  value:
                    error: "access_denied"
                expired:
                  summary: "过期或已用过"
                  value:
                    error: "expired_token"
        '403':
          $ref: "#/components/responses/ClientError"
        default:
          $ref: "#/components/responses/Error"

  /connect:
    post:
      tags: ["连接与授权"]
      summary: "用连接码换取访问令牌（旧方式，仍可用）"
      operationId: connectClient
      description: |
        **旧方式，仍然可用；新客户端请使用设备授权（`POST /device/code`）。**

        玩家在网页端「我的资料 → 在 VRCX 里提醒」生成 8 位一次性连接码（10 分钟内有效），客户端调用本接口换取 48 位十六进制 `token`。

        - 连接码中的空格、横线会被自动忽略，不区分大小写。
        - **每个客户端有自己的授权**：连接成功不会顶掉玩家的 VRCX 脚本或其他客户端；同一客户端再次连接会让它之前的令牌失效。权限为客户端默认的 `profile notifications crossings mutuals maps maps.rate`。玩家会收到站内通知（「刚在第三方客户端『…』里连上了」）。
        - 限制：每个网络地址每天最多尝试 30 次（超限返回 `429 too_many`）；全站当天错误码过多时暂停连接至次日（`429 busy`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: "8 位一次性连接码（忽略空格与横线，不区分大小写）"
                  example: "ABCD2345"
      responses:
        '200':
          description: "连接成功，返回访问令牌与玩家基本信息"
          content:
            application/json:
              schema:
                type: object
                required: [token, me]
                properties:
                  token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，仅保存在玩家本机，后续请求放入 Authorization: Bearer <token>"
                    example: "a1b2c3d4e5f60123456789abcdef0123456789abcdef0123"
                  me:
                    allOf:
                      - $ref: "#/components/schemas/Me"
                    description: "第三方客户端用连接码连上时 me.vrc 总是 null（默认权限里没有 vrchat）"
        '404':
          description: "连接码错误、已过期或已被使用（code）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "code"
        '429':
          description: "当前网络今日尝试次数用完（too_many）或全站今日错误过多暂停连接（busy）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "too_many"
        default:
          $ref: "#/components/responses/Error"

  /disconnect:
    post:
      tags: ["连接与授权"]
      summary: "断开连接并销毁令牌"
      operationId: disconnectClient
      description: "立即作废当前令牌（只断开这一个授权，玩家的 VRCX 脚本和其他客户端不受影响）；该玩家没有任何连接后，待收取的客户端提醒队列也会清空。"
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "已断开连接"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
        '401':
          $ref: "#/components/responses/AuthError"
        default:
          $ref: "#/components/responses/Error"

  /me/notifications:
    get:
      tags: ["玩家个人数据"]
      summary: "轮询新提醒（心跳）"
      operationId: pollNotifications
      description: |
        **需要权限 `notifications`。**

        在 VRChat 运行期间定期轮询新提醒（建议按响应中的 `every` 间隔，通常为 **60 秒**；同一授权两次请求间隔不得少于 **25 秒**）。

        - **首次调用（不带 `since`）**：仅返回当前最新游标 `last` 和未读红点 `dot`，`items` 为空数组（不重放历史提醒）。
        - **后续调用（带上一次的 `last` 作为 `since`）**：返回 `since` 之后产生的新提醒（最多 5 条，按时间从旧到新排列，仅保留最近 24 小时）。
        - 如果收到 `404 gone`，说明令牌已失效（玩家在网页断开、同一客户端再次授权、或删除了星），客户端应立即停止轮询并重新走设备授权。
      security:
        - client: []
          token: []
      parameters:
        - name: since
          in: query
          description: "上一次响应返回的 last 游标；首次轮询请省略此参数"
          schema:
            type: integer
            example: 1041
      responses:
        '200':
          description: "成功返回游标、新提醒与星轨相交未读数"
          content:
            application/json:
              schema:
                type: object
                required: [last, items, every, dot]
                properties:
                  last:
                    type: integer
                    description: "当前最新提醒 ID，下次轮询作为 since 传入"
                    example: 1042
                  items:
                    type: array
                    maxItems: 5
                    description: "新提醒列表（旧的在前）"
                    items:
                      $ref: "#/components/schemas/Notice"
                  every:
                    type: integer
                    description: "建议距离下次轮询的秒数"
                    example: 60
                  dot:
                    type: integer
                    description: "「星轨相交」中尚未查看的新人数，可用于显示红点"
                    example: 2
              examples:
                withItems:
                  summary: "收到新提醒"
                  value:
                    last: 1042
                    items:
                      - id: 1042
                        title: "星遇同频"
                        body: "有人连向了你"
                        at: 1792830000000
                    every: 60
                    dot: 2
                initial:
                  summary: "首次调用（不带 since）"
                  value:
                    last: 1042
                    items: []
                    every: 60
                    dot: 0
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          description: "距离上次轮询不足 25 秒（too_soon）或超过频率限制（too_many）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "too_soon"
                every: 60
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/recent:
    get:
      tags: ["玩家个人数据"]
      summary: "获取最近的提醒列表"
      operationId: getRecentNotifications
      description: |
        **需要权限 `notifications`。**

        获取最近 24 小时内的最后 5 条提醒（**新的在前**），包含对应的站内跳转路径 `url`。
        与 `/me/crossings`、`/me/mutuals`、`/me/maps/{world}` 共享每颗星每天 300 次的查看额度。
      security:
        - client: []
          token: []
      parameters:
        - name: mark
          in: query
          description: "传 1 表示玩家当前已打开查看，服务器会将最新一条 ID 记录到账号的 read 字段（跨设备同步已读状态）"
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: "最近的提醒列表"
          content:
            application/json:
              schema:
                type: object
                required: [items, read]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Notice"
                        - type: object
                          properties:
                            url:
                              type: [string, "null"]
                              description: "对应的星遇同频网页路径（以 /match/ 开头，接在 https://vrcc.cc 后），无跳转时为 null"
                              example: "/match/?tab=inbox"
                  read:
                    type: integer
                    description: "玩家最后已读的提醒 ID（大于该 ID 的可视作未读）"
                    example: 1040
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/crossings:
    get:
      tags: ["玩家个人数据"]
      summary: "获取「星轨相交」列表"
      operationId: getCrossings
      description: |
        **需要权限 `crossings`。**

        获取与网页端「连向我 → 星轨相交」一致的擦肩记录列表（在 VRChat 同一房间偶遇过的星遇同频玩家）。
        - 传 `?mark=1` 会清除未读红点。
        - 在浏览器中打开某颗星可使用 `https://vrcc.cc/match/?tab=inbox&cross={n}`。
        - 注意检查返回的 `why` 字段：当 `why` 不为 `null` 时，请在界面上向玩家说明原因（或当 `why === 'hide'` 时隐藏整个模块）。
      security:
        - client: []
          token: []
      parameters:
        - name: mark
          in: query
          description: "传 1 表示玩家已查看，消除星轨相交红点"
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: "星轨相交列表与状态"
          content:
            application/json:
              schema:
                type: object
                required: [stars, n, why, me]
                properties:
                  stars:
                    type: array
                    items:
                      type: object
                      required: [n, name, line, group, star, intro, vrc, linked, mutual, at, fresh]
                      properties:
                        n:
                          type: integer
                          description: "星的编号；网页直达地址：https://vrcc.cc/match/?tab=inbox&cross={n}"
                          example: 77
                        name:
                          type: string
                          description: "星位名称"
                          example: "拾光旅人"
                        line:
                          type: string
                          description: "星位的一句话描述"
                          example: "放慢脚步逛世界……"
                        group:
                          $ref: "#/components/schemas/Group"
                        star:
                          type: [integer, "null"]
                          description: "/light/ 点亮编号（对方未公开时为 null）"
                          example: 31
                        intro:
                          type: string
                          description: "匿名星卡介绍的前 60 个字"
                          example: "平时喜欢在安静的世界拍照、听音乐，偶尔去小众展览转转。"
                        vrc:
                          type: [string, "null"]
                          description: "对方的 VRChat 名字（仅在 mutual 为 true 双向连线后才返回，否则为 null）"
                          example: null
                        linked:
                          type: boolean
                          description: "我是否已经连向对方"
                          example: true
                        mutual:
                          type: boolean
                          description: "是否已经双向连上"
                          example: false
                        at:
                          type: integer
                          description: "相交发生的时间（毫秒时间戳）"
                          example: 1792830000000
                        fresh:
                          type: boolean
                          description: "是否为上次查看后新产生的记录"
                          example: true
                  n:
                    type: integer
                    description: "列表中的星数量"
                    example: 1
                  why:
                    type: [string, "null"]
                    enum: [null, "hide", "verify", "wait", "queued", "sent", "gone", "friend"]
                    description: |
                      星轨相交不可用或为空的原因：
                      - `null`：正常开启
                      - `hide`：不对该玩家开放（16–17 岁池，或在隐私设置中关闭了星轨相交），**客户端不应显示此模块**
                      - `verify`：尚未验证 VRChat 账号
                      - `wait`：VRChat 账号正在等待验证
                      - `queued` / `sent`：机器人「VRCC的小助手」的好友请求排队中 / 已发出，等待玩家在 VRChat 内同意
                      - `gone` / `friend`：玩家在 VRChat 内删除了机器人好友，或尚未开启机器人好友
                  me:
                    $ref: "#/components/schemas/Me"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/mutuals:
    get:
      tags: ["玩家个人数据"]
      summary: "获取「互相连上」的星友列表"
      operationId: getMutuals
      description: |
        **需要权限 `mutuals`。**

        返回与当前玩家已经**双向连线**的星友列表（按互相连上的时间倒序，最近连上的在前）。
        - 当对方已完成 VRChat 验证且隐私设置允许公开「已验证」时，会额外返回对方的 VRChat 用户 ID `vrcUser`（`usr_…`）。
        - **重要合规要求**：如果客户端提供「加好友」按钮，只能打开客户端自身的玩家资料页让玩家手动点击添加，**严禁由程序自动代替玩家向 VRChat 发送好友请求**。
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "互相连上的星友列表"
          content:
            application/json:
              schema:
                type: object
                required: [stars, n]
                properties:
                  stars:
                    type: array
                    items:
                      type: object
                      required: [n, name, group, star, vrc, vrcUser, at]
                      properties:
                        n:
                          type: integer
                          description: "星的编号"
                          example: 77
                        name:
                          type: string
                          description: "星位名称"
                          example: "拾光旅人"
                        group:
                          $ref: "#/components/schemas/Group"
                        star:
                          type: [integer, "null"]
                          description: "点亮编号"
                          example: 31
                        vrc:
                          type: [string, "null"]
                          description: "对方的 VRChat 显示名"
                          example: "StarTraveler"
                        vrcUser:
                          type: [string, "null"]
                          description: "对方的 VRChat 用户 ID（usr_…），仅在对方已验证且公开「已验证」标志时返回"
                          example: "usr_01234567-89ab-cdef-0123-456789abcdef"
                        at:
                          type: integer
                          description: "互相连上的时间（毫秒时间戳）"
                          example: 1792830000000
                  n:
                    type: integer
                    description: "互相连上的总数"
                    example: 1
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/card:
    get:
      tags: ["玩家个人数据"]
      summary: "获取我的星卡"
      operationId: getMyCard
      description: |
        **需要权限 `card`。**

        与网页「我的星」一致的星卡：星号、星位名与一句描述、星群、氛围、四个星群的成分与介绍。
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "我的星卡"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/maps:
    get:
      tags: ["玩家个人数据"]
      summary: "获取我打过分的地图"
      operationId: getMyMaps
      description: |
        **需要权限 `maps`。**

        玩家在地图榜打过分的地图（最近打的在前，最多 200 张），含短评与审核状态。
        与 `/me/notifications/recent`、`/me/crossings`、`/me/mutuals`、`/me/maps/{world}` 共享每颗星每天 300 次的查看额度。
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "我打过分的地图"
          content:
            application/json:
              schema:
                type: object
                required: [maps]
                properties:
                  maps:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/MyRating"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/maps/{world}:
    get:
      tags: ["玩家个人数据"]
      summary: "查询当前所在地图的状态与我的评分"
      operationId: getMyMapStatus
      description: |
        **需要权限 `maps`。**

        查询玩家当前所在的 VRChat 世界在星遇同频地图榜上的状态、玩家本人的打分与短评，以及现在是否允许打分。
        - 如果返回的 `off` 为 `true`，说明该地图被下架或不对该玩家的年龄池开放，客户端**不要显示**打分面板。
        - 如果 `board`、`pending`、`off` 均为 `false`，说明地图榜上还没有这张图，玩家首次打分时会自动将它提交到地图榜审核。
      security:
        - client: []
          token: []
      parameters:
        - name: world
          in: path
          required: true
          description: "玩家当前所在的地图 ID（仅 wrld_…，不要带房间实例号）"
          schema:
            $ref: "#/components/schemas/World"
      responses:
        '200':
          description: "当前地图状态与本人打分信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMap"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/maps/{world}/rating:
    post:
      tags: ["玩家个人数据"]
      summary: "给当前所在的地图打分与写短评"
      operationId: rateMyMap
      description: |
        **需要权限 `maps.rate`。**

        为玩家当前所在的地图打分（1–10 分），可选附带一句不超过 30 字的短评。
        - **必须由玩家本人主动点击触发**，严禁自动打分或批量打分。
        - `text` 处理规则：
          - 传入非空字符串：提交或更新短评（会经过与网页端相同的关键词与 AI 审核）；
          - 传入空字符串 `""`：删除已有的短评；
          - **不传 `text` 字段**：仅修改分数，保留原有短评不变。
        - 若该地图尚未收录进地图榜，首次打分会自动以该玩家为添加者提交收录。
      security:
        - client: []
          token: []
      parameters:
        - name: world
          in: path
          required: true
          description: "玩家当前所在的地图 ID（仅 wrld_…）"
          schema:
            $ref: "#/components/schemas/World"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: "评分（1–10 的整数）"
                  example: 9
                text:
                  type: string
                  maxLength: 30
                  description: "一句短评（最多 30 字；传空字符串删除短评；省略则只改分数）"
                  example: "光影很舒服，适合安静聊天"
      responses:
        '200':
          description: "打分成功，返回更新后的地图状态（同 GET /me/maps/{world}）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMap"
        '400':
          description: |
            参数或短评未通过检查：
            - `yq_words`：短评含违规词或包含自己的 VRChat 名字（`why` 字段说明具体原因）
            - `yq_empty`：短评仅包含标点符号或空白
            - `bad_request`：分数不在 1–10 之间或 `world` 格式错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "yq_words"
                why: "请不要在短评里留联系方式"
        '403':
          description: |
            当前不允许打分：
            - `scope`：令牌没有 `maps.rate` 权限（附带 `need`）
            - `client_mismatch`：令牌不是发给这个 `X-Client` 的
            - `map_not_went`：还不满足打分条件，`need` 字段指出缺少的步骤（`verify` / `friend` / `go`）
            - `map_elsewhere`：机器人看到玩家此刻在另一张地图上
            - `map_off` / `xd_world_no`：该地图已关闭评分或不对当前玩家开放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "map_not_went"
                need: "go"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /oauth/token:
    post:
      tags: ["用星遇同频登录"]
      summary: "用授权码换取令牌与玩家信息"
      operationId: oauthToken
      description: |
        网站在回调中**核对 `state` 之后**，用 `code` 换取令牌。**不需要 `X-Client`**，允许任何来源跨域调用。

        - 网站证明身份：`client_secret`（放在请求体，或 HTTP Basic `Authorization: Basic base64(client_id:client_secret)`），或 `code_verifier`（授权时带了 `code_challenge` 的必须提供）。授权时没带 `code_challenge` 的必须提供 `client_secret`。
        - `redirect_uri` 必须与授权时完全一致。
        - 同一玩家在同一网站再次登录，会让该网站之前拿到的令牌失效。
        - 响应中的 `scope` 是玩家同意的权限；`user.vrc` 只在有 `vrchat` 权限且玩家验证过时返回。
        - 令牌可调用 `GET /oauth/userinfo`，以及权限允许的 `/me/…` 接口（从服务器调用，`X-Client` 填 `client_id`）。
      security:
        - {}
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        '200':
          description: "换取成功"
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope, user]
                properties:
                  access_token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，用于 GET /oauth/userinfo 与权限允许的 /me/… 接口"
                    example: "b7e1c9d2a3f40123456789abcdef0123456789abcdef4567"
                  token_type:
                    type: string
                    const: "Bearer"
                  scope:
                    $ref: "#/components/schemas/Scope"
                  user:
                    $ref: "#/components/schemas/OAuthUser"
        '400':
          description: |
            - `invalid_request`：请求体格式错误
            - `unsupported_grant_type`：`grant_type` 不是 `authorization_code`
            - `invalid_grant`：`code` 错误、过期或已用过，`redirect_uri` 与授权时不一致，或 `code_verifier` 不对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_grant"
        '401':
          description: "`invalid_client`：`client_id` 未登记或已停用、密钥错误，或既没有密钥也没有使用 PKCE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_client"
        default:
          $ref: "#/components/responses/Error"

  /oauth/userinfo:
    get:
      tags: ["用星遇同频登录"]
      summary: "查询登录的玩家"
      operationId: oauthUserinfo
      description: |
        用 `POST /oauth/token` 拿到的令牌查询玩家，可用于确认玩家是否还连着、VRChat 名字是否有变化。**不需要 `X-Client`**，允许任何来源跨域调用。

        收到 `401 invalid_token` 时，说明玩家在「我的资料 → 第三方客户端」断开了你的网站，或网站已被停用：把这位玩家当作已登出。
      security:
        - oauth: []
      responses:
        '200':
          description: "玩家信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthUser"
        '401':
          description: "令牌无效：玩家已断开该网站，或网站已停用（invalid_token）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_token"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    client:
      type: apiKey
      in: header
      name: X-Client
      description: "已登记的客户端标识，或登记过的网站的 client_id（app_…）；开发自测阶段请使用 dev- 开头的标识（例如 dev-example）"
    clientQuery:
      type: apiKey
      in: query
      name: client
      description: "仅限开放数据接口：在无法设置请求头的环境（如 VRChat Udon）中，可将客户端标识放在 URL 查询参数 ?client="
    token:
      type: http
      scheme: bearer
      description: "设备授权（POST /device/token）或连接码（POST /connect）换取的 48 位十六进制令牌（仅限放入 Authorization 请求头，不可放入 URL）"
    clientBasic:
      type: http
      scheme: basic
      description: "用星遇同频登录：可用 HTTP Basic 传 client_id:client_secret（也可以放在请求体里）"
    oauth:
      type: oauth2
      description: "用星遇同频登录（授权码 + PKCE S256）。网站在「我的资料 → 第三方客户端 → 开发者 → 我登记的网站」自助登记获取 client_id 与 client_secret"
      flows:
        authorizationCode:
          authorizationUrl: "https://vrcc.cc/oauth/authorize"
          tokenUrl: "https://vrcc.cc/api/v1/oauth/token"
          scopes:
            profile: "识别你的登录身份，并读取你的星号（总会包含）"
            vrchat: "查看你的 VRChat 名字和 ID（验证过才提供）"
            card: "查看你的星卡（星群、介绍和成分）：GET /me/card"
            maps: "查看你在地图榜的评分和短评：GET /me/maps、GET /me/maps/{world}"
            maps.rate: "在你操作时，为你去过的地图打分：POST /me/maps/{world}/rating"
            notifications: "接收你的星遇同频提醒：GET /me/notifications、/me/notifications/recent"

  responses:
    ClientError:
      description: "客户端标识缺失、未登记（不是登记名单里的标识、登记过的网站 client_id 或 dev- 开头）或已被停用（client_missing / client_unknown / client_off）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            missing:
              summary: "未携带 client 标识"
              value:
                error: "client_missing"
            unknown:
              summary: "标识未登记且非 dev- 开头"
              value:
                error: "client_unknown"
            off:
              summary: "该标识已被后台停用"
              value:
                error: "client_off"
    AuthError:
      description: "未携带有效的 Authorization: Bearer <令牌> 请求头（token）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "token"
    ScopeError:
      description: "令牌不是发给这个 X-Client 的（client_mismatch，先检查），或令牌没有这个接口要的权限（scope，need 写着缺哪个；要用就让玩家重新授权并要上它）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            scope:
              summary: "缺少权限"
              value:
                error: "scope"
                need: "card"
            mismatch:
              summary: "令牌和 X-Client 不匹配"
              value:
                error: "client_mismatch"
    GoneError:
      description: "令牌已失效（玩家已断开、同一客户端再次授权、或删除了星），请停止请求并让玩家重新授权（gone）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "gone"
    RateLimitError:
      description: "请求过于频繁或今日额度已用完，请等待至少 60 秒后再试（too_many）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "too_many"
    Error:
      description: "错误响应"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    World:
      type: string
      pattern: "^wrld_[0-9a-f-]{36}$"
      description: "VRChat 世界 ID（wrld_ 加 UUID）"
      example: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    Need:
      type: [string, "null"]
      enum: ["verify", "friend", "go", null]
      description: |
        打分前置条件缺失原因：
        - `verify`：需要先在星遇同频验证 VRChat 账号
        - `friend`：需要先在 VRChat 中同意机器人「VRCC的小助手」的好友请求
        - `go`：需要先在这张地图里待一会儿（让机器人看到你在场，或有过到访记录）
        - `null`：已满足条件

    Group:
      type: string
      enum: ["G", "W", "Z", "L", "A"]
      description: |
        所属星群代号：
        - `G`：漫游（观景 / 探索 / 拍照）
        - `W`：游戏（桌游 / 竞技 / 合作）
        - `Z`：创作（建模 / 改模 / 开发）
        - `L`：聊天（陪伴 / 挂机 / 谈心）
        - `A`：万象（多面兼顾）
      example: "G"

    Me:
      type: object
      required: [star, vrc]
      properties:
        star:
          type: [integer, "null"]
          description: "玩家在 /light/ 的点亮编号（无编号时为 null）"
          example: 128
        vrc:
          type: [string, "null"]
          description: "玩家当前登记的 VRChat 名字（device/token 只在有 vrchat 权限时给；第三方客户端用 connect 时为 null）"
          example: "MyVRCName"

    Scope:
      type: string
      description: |
        空格分隔的权限（请求时也接受逗号或 `+`），返回时按固定顺序、`profile` 在最前：
        `profile` `vrchat` `card` `maps` `maps.rate` `notifications` `crossings` `mutuals`。
        客户端可要全部 8 项；网站（登录或设备授权）最多 `profile vrchat card maps maps.rate notifications`。
      example: "profile notifications maps maps.rate"

    Card:
      type: object
      required: [star, name, line, group, groupName, vibe, scores, intro]
      properties:
        star:
          type: [integer, "null"]
          description: "/light/ 点亮编号（没有时为 null）"
          example: 128
        name:
          type: string
          description: "星位名称"
          example: "拾光旅人"
        line:
          type: string
          description: "星位的一句话描述"
          example: "放慢脚步逛世界，在角落拍下别人没注意到的光。"
        group:
          $ref: "#/components/schemas/Group"
        groupName:
          type: string
          description: "星群名称"
          example: "漫游星群"
        vibe:
          type: string
          enum: ["安静", "随场", "热闹"]
          description: "氛围"
          example: "安静"
        scores:
          type: object
          description: "四个星群的成分（0–100）"
          required: [G, W, Z, L]
          properties:
            G:
              type: integer
              example: 82
            W:
              type: integer
              example: 40
            Z:
              type: integer
              example: 35
            L:
              type: integer
              example: 61
        intro:
          type: [string, "null"]
          description: "星卡介绍；还在生成中时为 null"
          example: "平时喜欢在安静的世界拍照、听音乐。"

    MyRating:
      type: object
      required: [world, name, score, words, wordsOk, at, page]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: [string, "null"]
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        score:
          type: integer
          minimum: 1
          maximum: 10
          description: "我打的分"
          example: 9
        words:
          type: [string, "null"]
          description: "我写的短评（没写时为 null）"
          example: "光影很舒服，适合安静聊天"
        wordsOk:
          type: [string, "null"]
          enum: ["wait", "ok", "hidden", null]
          description: "短评审核状态：wait 审核中、ok 已通过、hidden 未通过；没写短评时为 null"
          example: "ok"
        at:
          type: integer
          description: "打分时间（毫秒时间戳）"
          example: 1792830000000
        page:
          type: string
          description: "该地图在地图榜上的详情页"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    DeviceCode:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval, scope]
      properties:
        device_code:
          type: string
          pattern: "^[0-9a-f]{48}$"
          description: "48 位十六进制设备码，客户端自己保存，用于 POST /device/token，不要展示给玩家"
          example: "9f2c4e1a7b3d5f6081726354a0b1c2d3e4f5a6b7c8d9e0f1"
        user_code:
          type: string
          pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"
          description: "展示给玩家的码，玩家可在「我的资料 → 第三方客户端」手动输入"
          example: "ABCD-2345"
        verification_uri:
          type: string
          description: "玩家手动输入码的页面"
          example: "https://vrcc.cc/match/?connect"
        verification_uri_complete:
          type: string
          description: "已带上码的同意链接，在浏览器中打开即可"
          example: "https://vrcc.cc/match/?connect=ABCD2345"
        expires_in:
          type: integer
          description: "有效秒数"
          example: 600
        interval:
          type: integer
          description: "调用 POST /device/token 的间隔秒数"
          example: 5
        scope:
          $ref: "#/components/schemas/Scope"

    OAuthTokenRequest:
      type: object
      required: [grant_type, code, redirect_uri, client_id]
      properties:
        grant_type:
          type: string
          const: "authorization_code"
        code:
          type: string
          pattern: "^[0-9a-f]{48}$"
          description: "回调中带回的授权码（5 分钟内有效，只能用一次）"
        redirect_uri:
          type: string
          description: "与授权时完全一致的回调地址"
          example: "https://example.com/callback"
        client_id:
          type: string
          pattern: "^app_[0-9a-f]{16}$"
          example: "app_0123456789abcdef"
        client_secret:
          type: string
          pattern: "^sec_[0-9a-f]{48}$"
          description: "网站密钥（只在服务器上使用）；也可以改用 HTTP Basic"
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: "PKCE 原文；授权时带了 code_challenge 的必须提供"

    OAuthUser:
      type: object
      required: [sub, star, vrc]
      properties:
        sub:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: "该玩家在本网站的编号（固定不变，不同网站拿到的不同），请用它作为账号主键"
          example: "3f9a1c7e5b2d4f6081a2b3c4d5e6f708"
        star:
          type: [integer, "null"]
          description: "玩家在 /light/ 的星号（没有时为 null）"
          example: 128
        vrc:
          description: "只在有 vrchat 权限、且玩家在星遇同频验证过 VRChat 账号时返回，否则为 null"
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  description: "VRChat 用户 ID"
                  example: "usr_01234567-89ab-cdef-0123-456789abcdef"
                name:
                  type: [string, "null"]
                  description: "VRChat 显示名"
                  example: "MyVRCName"
            - type: "null"

    Notice:
      type: object
      required: [id, title, body, at]
      properties:
        id:
          type: integer
          description: "提醒递增编号"
          example: 1042
        title:
          type: string
          description: "提醒标题"
          example: "星遇同频"
        body:
          type: string
          description: "提醒正文"
          example: "有人连向了你"
        at:
          type: integer
          description: "产生时间（毫秒时间戳）"
          example: 1792830000000

    BoardMap:
      type: object
      required: [world, name, author, avg, raters, rank, weight, page, img]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: string
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        author:
          type: [string, "null"]
          description: "地图作者名称"
          example: "Shiori"
        avg:
          type: [number, "null"]
          description: "1–10 分的平均分（保留一位小数，无人评分时为 null）"
          example: 9.2
        raters:
          type: integer
          description: "评分人数"
          example: 18
        rank:
          type: [integer, "null"]
          description: "总榜名次（不满 5 人评分时为 null）"
          example: 1
        weight:
          type: [string, "null"]
          enum: ["light", "mid", "heavy", null]
          description: "多小咕实测性能档位：light 轻量、mid 中等、heavy 较重，未测过为 null"
          example: "light"
        page:
          type: string
          description: "该地图在星遇同频地图榜上的详情页网址"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
        img:
          type: [string, "null"]
          description: "地图封面图网址"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd.jpg"

    MyMap:
      type: object
      required: [world, name, board, pending, off, avg, raters, mine, can, need, words, wordsOk, img]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: [string, "null"]
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        board:
          type: boolean
          description: "是否已正式在地图榜上展示"
          example: true
        pending:
          type: boolean
          description: "是否已提交收录、正在等待审核"
          example: false
        off:
          type: boolean
          description: "是否不给当前玩家看（为 true 时客户端应隐藏此地图卡片）"
          example: false
        avg:
          type: [number, "null"]
          description: "当前平均分（1–10，一位小数）"
          example: 9.2
        raters:
          type: integer
          description: "当前评分人数"
          example: 18
        mine:
          type: [integer, "null"]
          description: "我打过的分数（1–10，未打分时为 null）"
          example: 9
        can:
          type: boolean
          description: "我现在是否可以给这张地图打分"
          example: true
        need:
          $ref: "#/components/schemas/Need"
        words:
          type: [string, "null"]
          description: "我写的短评（未写时为 null）"
          example: "光影很舒服，适合安静聊天"
        wordsOk:
          type: [string, "null"]
          enum: ["wait", "ok", "hidden", null]
          description: "我的短评审核状态：wait 审核中、ok 已通过、hidden 未通过、无短评时为 null"
          example: "ok"
        img:
          type: [string, "null"]
          description: "封面相对路径（接在 https://vrcc.cc 后面使用），无封面或不可见时为 null"
          example: "/api/match?xdimg=wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            机器可读的错误码：
            - `client_missing` (403)：未携带 `client` 标识
            - `client_unknown` (403)：`client` 不在登记名单中且非 `dev-` 开头
            - `client_off` (403)：该 `client` 标识已被停用
            - `token` (401)：未携带或格式错误的 `Authorization: Bearer` 令牌
            - `scope` (403)：令牌没有该接口要的权限（附带 `need`）
            - `invalid_scope` (400)：设备授权的 `scope` 中有不认识的权限，或网站要了网站不能要的权限
            - `client_mismatch` (403)：令牌不是发给这个 `X-Client` 的
            - `gone` (404)：令牌已失效（断开、被新连接顶掉、星已删除）
            - `code` (404)：连接码错误、过期或已使用
            - `not_found` (404)：接口不存在或地图不在榜上
            - `too_many` (429)：超出频率或每日次数限制
            - `too_soon` (429)：提醒轮询间隔不足 25 秒（附带 `every`）
            - `busy` (429)：全站今日错误连接码过多，连接功能暂停至次日
            - `map_not_went` (403)：尚不满足打分条件（附带 `need`）
            - `map_elsewhere` (403)：机器人看到玩家当前在另一张地图
            - `map_off` / `xd_world_no` (403)：该地图不允许打分或不对该玩家开放
            - `yq_words` (400)：短评未通过关键词检查（附带 `why`）
            - `yq_empty` (400)：短评仅含符号或空白
            - `bad_request` (400)：请求体或参数格式错误
            - `too_large` (413)：请求体超过 2 KB
            - `authorization_pending` (400)：设备授权，玩家还没点「同意连接」
            - `access_denied` (400)：设备授权，玩家点了「取消」
            - `expired_token` (400)：设备授权，设备码过期、已换过令牌、客户端不一致或不存在
            - `invalid_request` / `unsupported_grant_type` / `invalid_grant` (400)：用星遇同频登录，换令牌请求有误
            - `invalid_client` (401)：用星遇同频登录，网站未登记 / 已停用、密钥错误或缺少密钥与 PKCE
            - `invalid_token` (401)：用星遇同频登录，玩家已断开该网站或网站已停用
        every:
          type: integer
          description: "too_soon 时返回，建议多少秒后再试"
        need:
          type: string
          description: "map_not_went 时为缺少的打分条件（verify / friend / go，见 Need）；scope 时为缺少的权限"
          example: "go"
        why:
          type: string
          description: "yq_words 时返回，短评未通过的原因"
