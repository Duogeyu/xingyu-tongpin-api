                error: "not_found"
        default:
          $ref: "#/components/responses/Error"

  /device/code:
    post:
      tags: ["连接与授权"]
      summary: "设备授权：获取设备码与同意链接（推荐）"
      operationId: deviceCode
      description: |
        设备授权（RFC 8628）第一步。请求体可省略；需要指定权限时带 `scope`（省略时：开 Issue 登记的客户端为 `profile notifications crossings mutuals maps maps.rate`，`dev-` 为 `profile notifications maps`；`profile` 总会加上）。敏感权限只给开 Issue 登记的客户端与审核通过的自助登记应用；未审核的应用只有登记人本人的账号能同意敏感权限（用于开发测试），其他玩家同意时返回 `403 scope_unreviewed`；`dev-` 标识只能要普通权限（要了返回 `403 scope_unreviewed`）。

        自助登记的应用（`X-Client` 为 `app_…`）也可使用：省略 `scope` 时只有 `profile`；未审核时敏感权限只有登记人能同意，其他玩家点同意会被拒，客户端会一直等到 `expired_token`；同意页显示登记的名称与「玩家自行登记，未经星遇同频审核」。

        - 客户端向玩家显示 `user_code`，并在浏览器中打开 `verification_uri_complete`（码已包含在链接中）；玩家也可以在「我的资料 → 第三方客户端」手动输入 `user_code`。
        - 玩家需已登录星遇同频，会看到客户端名字（未登记的 `dev-` 标识显示「（测试中）」与「未登记客户端（仅测试用）」；自助登记的应用显示其登记的名称与「玩家自行登记，未经星遇同频审核」）及所要的每一项权限（顶上写一共需要几项普通权限、几项敏感权限；敏感的排在前面、标着「敏感」；超过三项的先收起，可以展开），再点「同意连接」或「取消」。
        - `device_code` 仅由客户端保存，用于调用 `POST /device/token`，不要展示给玩家。
        - `scope` 中有不认识的权限：`400 invalid_scope`。
        - 限制：每个网络地址每天最多获取 30 个（超限返回 `429 too_many`）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  $ref: "#/components/schemas/Scope"
            example:
              scope: "notifications maps maps.rate"
      responses:
        '200':
          description: "设备码与同意链接"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        '400':
          description: "scope 中有不认识的权限（invalid_scope）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_scope"
        '403':
          $ref: "#/components/responses/ClientError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /device/token:
    post:
      tags: ["连接与授权"]
      summary: "设备授权：轮询换取访问令牌"
      operationId: deviceToken
      description: |
        设备授权第二步：每隔 `interval` 秒（5 秒）调用一次，**不要更快**；`X-Client` 必须与获取设备码时相同。拿到的令牌之后也只能配这个 `X-Client` 使用（否则 `403 client_mismatch`）。

        - 等待中：`400 authorization_pending`，继续等待；
        - 玩家点了「取消」：`400 access_denied`，停止；
        - 过期（10 分钟）、已换过令牌、客户端不一致或设备码不存在：`400 expired_token`，停止，需要时重新获取设备码；
        - 玩家同意后：`200`，返回令牌（**只返回这一次**，之后再问是 `expired_token`）。

        同一客户端再次为同一玩家授权，会让该客户端之前的令牌失效；不会影响 VRCX 脚本或其他客户端。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
                  pattern: "^[0-9a-f]{48}$"
                  description: "POST /device/code 返回的 device_code"
                  example: "9f2c4e1a7b3d5f6081726354a0b1c2d3e4f5a6b7c8d9e0f1"
      responses:
        '200':
          description: "玩家已同意，返回访问令牌（仅一次）"
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope, me]
                properties:
                  access_token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，仅保存在玩家本机，后续请求放入 Authorization: Bearer <access_token>"
                    example: "a1b2c3d4e5f60123456789abcdef0123456789abcdef0123"
                  token_type:
                    type: string
                    const: "Bearer"
                  scope:
                    $ref: "#/components/schemas/Scope"
                  me:
                    allOf:
                      - $ref: "#/components/schemas/Me"
                    description: "me.vrc 只在有 vrchat 权限时返回，否则为 null"
        '400':
          description: |
            尚未拿到令牌：
            - `authorization_pending`：玩家还没点，过 `interval` 秒再问
            - `access_denied`：玩家点了「取消」
            - `expired_token`：已过期、已换过、客户端不一致或设备码不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                pending:
                  summary: "等待玩家同意"
                  value:
                    error: "authorization_pending"
                denied:
                  summary: "玩家点了取消"
                  value:
                    error: "access_denied"
                expired:
                  summary: "过期或已用过"
                  value:
                    error: "expired_token"
        '403':
          $ref: "#/components/responses/ClientError"
        default:
          $ref: "#/components/responses/Error"

  /connect:
    post:
      tags: ["连接与授权"]
      summary: "用连接码换取访问令牌（旧方式，仍可用）"
      operationId: connectClient
      description: |
        **旧方式，仍然可用；新客户端请使用设备授权（`POST /device/code`）。**

        玩家在网页端「我的资料 → 在 VRCX 里提醒」生成 8 位一次性连接码（10 分钟内有效），客户端调用本接口换取 48 位十六进制 `token`。

        - 连接码中的空格、横线会被自动忽略，不区分大小写。
        - **每个客户端有自己的授权**：连接成功不会顶掉玩家的 VRCX 脚本或其他客户端；同一客户端再次连接会让它之前的令牌失效。权限：开 Issue 登记的客户端为 `profile notifications crossings mutuals maps maps.rate`，`dev-` 与自助登记的应用为 `profile notifications maps`。玩家会收到站内通知（「刚在第三方客户端『…』里连上了」）。
        - 限制：每个网络地址每天最多尝试 30 次（超限返回 `429 too_many`）；全站当天错误码过多时暂停连接至次日（`429 busy`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: "8 位一次性连接码（忽略空格与横线，不区分大小写）"
                  example: "ABCD2345"
      responses:
        '200':
          description: "连接成功，返回访问令牌与玩家基本信息"
          content:
            application/json:
              schema:
                type: object
                required: [token, me]
                properties:
                  token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，仅保存在玩家本机，后续请求放入 Authorization: Bearer <token>"
                    example: "a1b2c3d4e5f60123456789abcdef0123456789abcdef0123"
                  me:
                    allOf:
                      - $ref: "#/components/schemas/Me"
                    description: "第三方客户端用连接码连上时 me.vrc 总是 null（默认权限里没有 vrchat）"
        '404':
          description: "连接码错误、已过期或已被使用（code）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "code"
        '429':
          description: "当前网络今日尝试次数用完（too_many）或全站今日错误过多暂停连接（busy）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "too_many"
        default:
          $ref: "#/components/responses/Error"

  /disconnect:
    post:
      tags: ["连接与授权"]
      summary: "断开连接并销毁令牌"
      operationId: disconnectClient
      description: "立即作废当前令牌（只断开这一个授权，玩家的 VRCX 脚本和其他客户端不受影响）；该玩家没有任何连接后，待收取的客户端提醒队列也会清空。"
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "已断开连接"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          description: "client_mismatch：令牌不是发给这个 X-Client 的"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        default:
          $ref: "#/components/responses/Error"

  /me/notifications:
    get:
      tags: ["玩家个人数据"]
      summary: "轮询新提醒（心跳）"
      operationId: pollNotifications
      description: |
        **需要权限 `notifications`。**

        在 VRChat 运行期间定期轮询新提醒（建议按响应中的 `every` 间隔，通常为 **60 秒**；同一授权两次请求间隔不得少于 **25 秒**）。

        - **首次调用（不带 `since`）**：仅返回当前最新游标 `last` 和未读红点 `dot`，`items` 为空数组（不重放历史提醒）。
        - **后续调用（带上一次的 `last` 作为 `since`）**：返回 `since` 之后产生的新提醒（最多 5 条，按时间从旧到新排列，仅保留最近 24 小时）。
        - 如果收到 `404 gone`，说明令牌已失效（玩家在网页断开、同一客户端再次授权、或删除了星），客户端应立即停止轮询并重新走设备授权。
      security:
        - client: []
          token: []
      parameters:
        - name: since
          in: query
          description: "上一次响应返回的 last 游标；首次轮询请省略此参数"
          schema:
            type: integer
            example: 1041
      responses:
        '200':
          description: "成功返回游标、新提醒与星轨相交未读数"
          content:
            application/json:
              schema:
                type: object
                required: [last, items, every, dot]
                properties:
                  last:
                    type: integer
                    description: "当前最新提醒 ID，下次轮询作为 since 传入"
                    example: 1042
                  items:
                    type: array
                    maxItems: 5
                    description: "新提醒列表（旧的在前）"
                    items:
                      $ref: "#/components/schemas/Notice"
                  every:
                    type: integer
                    description: "建议距离下次轮询的秒数"
                    example: 60
                  dot:
                    type: integer
                    description: "「星轨相交」中尚未查看的新人数，可用于显示红点"
                    example: 2
                  latest:
                    type: integer
                    description: "我们 VRCX 脚本的最新版本号（给 VRCX 脚本提示更新用，别的客户端用不到）"
                    example: 4
              examples:
                withItems:
                  summary: "收到新提醒"
                  value:
                    last: 1042
                    items:
                      - id: 1042
                        title: "星遇同频"
                        body: "有人连向了你"
                        at: 1792830000000
                    every: 60
                    dot: 2
                initial:
                  summary: "首次调用（不带 since）"
                  value:
                    last: 1042
                    items: []
                    every: 60
                    dot: 0
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          description: "距离上次轮询不足 25 秒（too_soon）或超过频率限制（too_many）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "too_soon"
                every: 60
        default:
          $ref: "#/components/responses/Error"

  /me/notifications/recent:
    get:
      tags: ["玩家个人数据"]
      summary: "获取最近的提醒列表"
      operationId: getRecentNotifications
      description: |
        **需要权限 `notifications`。**

        获取最近 24 小时内的最后 5 条提醒（**新的在前**），包含对应的站内跳转路径 `url`。
        与 `/me/crossings`、`/me/mutuals`、`/me/maps/{world}` 共享每个授权每天 1000 次的查看额度。
      security:
        - client: []
          token: []
      parameters:
        - name: mark
          in: query
          description: "传 1 表示玩家当前已打开查看，服务器会将最新一条 ID 记录到账号的 read 字段（跨设备同步已读状态）"
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: "最近的提醒列表"
          content:
            application/json:
              schema:
                type: object
                required: [items, read]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Notice"
                        - type: object
                          properties:
                            url:
                              type: [string, "null"]
                              description: "对应的星遇同频网页路径（以 /match/ 开头，接在 https://vrcc.cc 后），无跳转时为 null"
                              example: "/match/?tab=inbox"
                  read:
                    type: integer
                    description: "玩家最后已读的提醒 ID（大于该 ID 的可视作未读）"
                    example: 1040
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        default:
          $ref: "#/components/responses/Error"

  /me/crossings:
    get:
      tags: ["玩家个人数据"]
      summary: "获取「星轨相交」列表"
      operationId: getCrossings
      description: |
        **需要权限 `crossings`。**

        获取与网页端「连向我 → 星轨相交」一致的擦肩记录列表（在 VRChat 同一房间偶遇过的星遇同频玩家）。
        - 传 `?mark=1` 会清除未读红点。
        - 在浏览器中打开某颗星可使用 `https://vrcc.cc/match/?tab=inbox&cross={n}`。
        - 注意检查返回的 `why` 字段：当 `why` 不为 `null` 时，请在界面上向玩家说明原因（或当 `why === 'hide'` 时隐藏整个模块）。
      security:
        - client: []
          token: []
      parameters:
        - name: mark
          in: query
          description: "传 1 表示玩家已查看，消除星轨相交红点"
          schema:
            type: string
            enum: ["1"]
      responses:
        '200':
          description: "星轨相交列表与状态"
          content:
            application/json:
              schema:
                type: object
                required: [stars, n, why, me]
                properties:
                  stars:
                    type: array
                    items:
                      type: object
                      required: [n, name, line, group, star, intro, vrc, linked, mutual, at, fresh]
                      properties:
                        n:
                          type: integer
                          description: "星的编号；网页直达地址：https://vrcc.cc/match/?tab=inbox&cross={n}"
                          example: 77
                        name:
                          type: string
                          description: "星位名称"
                          example: "拾光旅人"
                        line:
                          type: string
                          description: "星位的一句话描述"
                          example: "放慢脚步逛世界……"
                        group:
                          $ref: "#/components/schemas/Group"
                        star:
                          type: [integer, "null"]
                          description: "/light/ 点亮编号（对方未公开时为 null）"
                          example: 31
                        intro:
                          type: string
                          description: "匿名星卡介绍的前 60 个字"
                          example: "平时喜欢在安静的世界拍照、听音乐，偶尔去小众展览转转。"
                        vrc:
                          type: [string, "null"]
                          description: "对方的 VRChat 名字（仅在 mutual 为 true 双向连线后才返回，否则为 null）"
                          example: null
                        linked:
                          type: boolean
                          description: "我是否已经连向对方"
                          example: true
                        mutual:
                          type: boolean
                          description: "是否已经双向连上"
                          example: false
                        at:
                          type: integer
                          description: "相交发生的时间（毫秒时间戳）"
                          example: 1792830000000
                        fresh:
                          type: boolean
                          description: "是否为上次查看后新产生的记录"
                          example: true
