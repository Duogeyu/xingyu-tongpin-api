      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: cat }
        - { name: fin, in: query, schema: { type: string, default: paper }, description: "材质" }
        - { name: wear, in: query, schema: { type: number, minimum: 0, maximum: 5, default: 0 }, description: "磨损，0 全新到 5" }
        - { name: seed, in: query, schema: { type: integer, default: 1 }, description: "划痕落在哪里" }
      responses:
        "200":
          description: "贴纸的图"
          content:
            image/svg+xml:
              schema: { type: string }
        "302":
          description: "图片贴纸：跳到它的 webp"
        "400":
          description: "材质、磨损或种子不对"
        "404":
          description: "没有这张贴纸"
  /status:
    get:
      tags: ["开放数据"]
      summary: "运行状态"
      operationId: getStatus
      description: |
        接口和数据库能不能用。不用 `client`。页面版：https://vrcc.cc/status/
      security: []
      responses:
        "200":
          description: "正常"
          content:
            application/json:
              schema: { type: object, properties: { at: { type: integer }, state: { type: string, enum: ["ok"] } } }
        "500":
          description: "接口出问题了"
  /me/today:
    get:
      tags: ["网页上的动作"]
      summary: "今天的星"
      operationId: getToday
      description: |
        **需要权限 `today`。** 与网页「今天」相同（网页动作 `recs`）。会看到其他玩家的资料。
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "这一轮路过的星"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [day, cards, round]
                properties:
                  day:
                    type: string
                    description: "第几轮（# 加序号）"
                    example: "#12"
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/StarCard"
                  round:
                    type: object
                    additionalProperties: true
                    properties:
                      at:
                        type: integer
                        description: "这一轮开始时间（毫秒）"
                      next:
                        type: integer
                        description: "下一轮时间（毫秒）"
                      used:
                        type: integer
                        description: "这一轮已连几颗"
                      max:
                        type: integer
                        description: "这一轮最多能连几颗"
                      remind:
                        type: boolean
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/inbox:
    get:
      tags: ["网页上的动作"]
      summary: "连向我"
      operationId: getInbox
      description: |
        **需要权限 `inbox`。** 与网页「连向我」相同（网页动作 `inbox`）。会看到其他玩家的资料。
      security:
        - client: []
          token: []
      parameters:
        - name: mark
          in: query
          description: "传 1（或 true）表示玩家现在看过了（记在账号上）；0、false 或不传不标"
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        '200':
          description: "连向玩家的星"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [cards, counts, seen, cross]
                properties:
                  cards:
                    type: array
                    description: "连向玩家的星，最近的在前"
                    items:
                      $ref: "#/components/schemas/StarCard"
                  counts:
                    type: object
                    additionalProperties: true
                    description: "连向我（in）、我连向（out）、互相连上（mutual）、未读通知（notes）、未读私聊（msgs）。regenToday、styles 已弃用（网页不显示），2026-11-26 起不再返回"
                  seen:
                    type: integer
                    description: "上次看过的最新时间（毫秒），at 比它新的是新的"
                  cross:
                    type: object
                    description: "星轨相交：一共几颗（n）、还没看过的几颗（fresh）"
                    properties:
                      "n": { type: integer, example: 3 }
                      fresh: { type: integer, example: 1 }
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/links:
    post:
      tags: ["网页上的动作"]
      summary: "连线"
      operationId: linkStar
      description: |
        **需要权限 `link`。只在玩家本人主动点击时调用。** 与网页连线相同（网页动作 `link`）。

        只能连网页允许的星：今天这一轮的、连回连向我的、星友的星友、星轨相交里的（`via: "cross"`）、星友圈里的（`via: "yq"` 加 `post`）。
        常见错误：`403 not_offered`、`429 quota`（这一轮连满）、`429 fof_day` / `yq_link_day` / `cross_link_day`、`404 star_gone`（对方不在了）、`404 yq_gone`、`400 bad_target`。
      security:
        - client: []
          token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: integer
                  description: "对方星的编号 n"
                  example: 77
                via:
                  type: string
                  enum: ["cross", "yq"]
                  description: "从哪连：cross 星轨相交，yq 星友圈"
                post:
                  type: integer
                  description: "via 为 yq 时，那条动态的 id"
      responses:
        '200':
          description: "已连上"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [mutual, card]
                properties:
                  mutual:
                    type: boolean
                    description: "这一下是否就互相连上了"
                  card:
                    $ref: "#/components/schemas/StarCard"
        '400':
          $ref: "#/components/responses/Error"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/chats:
    get:
      tags: ["网页上的动作"]
      summary: "私聊列表"
      operationId: getChats
      description: |
        **需要权限 `chat`。** 与网页「消息」相同（网页动作 `threads`），最近的在前。
      security:
        - client: []
          token: []
      responses:
        '200':
          description: "私聊列表"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [threads]
                properties:
                  threads:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        peer:
                          $ref: "#/components/schemas/Peer"
                        last:
                          $ref: "#/components/schemas/Msg"
                        unread:
                          type: integer
                          description: "对方发来还没读的条数"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/chats/{n}:
    get:
      tags: ["网页上的动作"]
      summary: "私聊记录"
      operationId: getChat
      description: |
        **需要权限 `chat`。** 与星 `n` 的对话（网页动作 `msgs`），旧的在前，一次一页；读后对方的消息标为已读。只能看互相连上的人（否则 `403 msg_not_mutual`）。
      security:
        - client: []
          token: []
      parameters:
        - name: n
          in: path
          required: true
          description: "对方星的编号"
          schema:
            type: integer
        - name: before
          in: query
          description: "往前翻一页：这条 id 之前的"
          schema:
            type: integer
        - name: after
          in: query
          description: "只要这条 id 之后的"
          schema:
            type: integer
        - name: since
          in: query
          description: "从这条 id 起到现在的全部（用来核对已显示的消息有没有被撤回或隐藏）"
          schema:
            type: integer
      responses:
        '200':
          description: "一页消息"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [msgs, more, peer]
                properties:
                  msgs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Msg"
                  more:
                    type: boolean
                    description: "前面还有没有"
                  peer:
                    $ref: "#/components/schemas/Peer"
                  max:
                    type: integer
                    description: "一条消息最多几个字"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: ["网页上的动作"]
      summary: "发私聊"
      operationId: sendChat
      description: |
        **需要权限 `chat.send`。只在玩家本人主动点击「发送」时调用，严禁群发。** 网页动作 `msg`。

        只能发给互相连上的人（否则 `403 msg_not_mutual`）；文字与网页一样要过检查（`400 msg_words` 附 `why`、`400 msg_empty`）。
      security:
        - client: []
          token: []
      parameters:
        - name: n
          in: path
          required: true
          description: "对方星的编号"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: "消息文字"
                  example: "你好"
                sticker:
                  type: string
                  description: "或者发一个网页上的表情（与 text 二选一）"
      responses:
        '200':
          description: "已发出"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [msg]
                properties:
                  msg:
                    $ref: "#/components/schemas/Msg"
        '400':
          $ref: "#/components/responses/Error"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /me/posts:
    get:
      tags: ["网页上的动作"]
      summary: "星友圈"
      operationId: getPosts
      description: |
        **需要权限 `posts`。** 与网页「星友圈」相同（网页动作 `yq`）。会看到其他玩家的动态。第一页还带网页用的其他字段。
        有图的动态，`img` 为 `{w, h, grid, url}`：`url` 是这张图的签名地址（`GET /img/{id}`），10 分钟内有效，可直接用作 `<img src>`。
      security:
        - client: []
          token: []
      parameters:
        - name: f
          in: query
          description: "all 全部（默认）、friend 星友的、mine 自己的"
          schema:
            type: string
            enum: ["all", "friend", "mine"]
        - name: before
          in: query
          description: "往前翻页：上一页最后一条的 id"
          schema:
            type: integer
      responses:
        '200':
          description: "一页动态"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [posts]
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  page:
                    type: integer
                    description: "一页几条"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: ["网页上的动作"]
      summary: "发星友圈"
      operationId: writePost
      description: |
        **需要权限 `posts.write`。只在玩家本人主动点击「发布」时调用。** 网页动作 `yq-post`，只能发文字，不能带图。

        文字与网页一样要过检查（`400 yq_words` 附 `why`、`400 yq_empty`）；检查通过后别人才看得到（`post.check`）。
      security:
        - client: []
          token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, text]
              properties:
                kind:
                  type: string
                  const: "text"
                text:
                  type: string
                  example: "今天在星夜茶屋认识了新朋友"
                vis:
                  type: string
                  enum: ["all", "mutual"]
                  default: "all"
                  description: "all 所有人、mutual 只给互相连上的人"
      responses:
        '200':
          description: "已发出"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [ok, post]
                properties:
                  ok:
                    type: boolean
                    const: true
                  post:
                    $ref: "#/components/schemas/Post"
        '400':
          $ref: "#/components/responses/Error"
        '401':
          $ref: "#/components/responses/AuthError"
        '403':
          $ref: "#/components/responses/ScopeError"
        '404':
          $ref: "#/components/responses/GoneError"
        '429':
          $ref: "#/components/responses/RateLimitError"
        default:
          $ref: "#/components/responses/Error"

  /oauth/token:
    post:
      tags: ["用星遇同频登录"]
      summary: "用授权码换取令牌与玩家信息"
      operationId: oauthToken
      description: |
        网站在回调中**核对 `state` 之后**，用 `code` 换取令牌。**不需要 `X-Client`**，允许任何来源跨域调用。

        - 网站证明身份：`client_secret`（放在请求体，或 HTTP Basic `Authorization: Basic base64(client_id:client_secret)`），或 `code_verifier`（授权时带了 `code_challenge` 的必须提供）。授权时没带 `code_challenge` 的必须提供 `client_secret`。
        - `redirect_uri` 必须与授权时完全一致。
        - 同一玩家在同一网站再次登录，会让该网站之前拿到的令牌失效。
        - 响应中的 `scope` 是玩家同意的权限；`user.vrc` 只在有 `vrchat` 权限且玩家验证过时返回。
        - 令牌可调用 `GET /oauth/userinfo`，以及权限允许的 `/me/…` 接口（从服务器调用，`X-Client` 填 `client_id`）。
      security:
        - {}
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        '200':
          description: "换取成功"
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, scope, user]
                properties:
                  access_token:
                    type: string
                    pattern: "^[0-9a-f]{48}$"
                    description: "48 位十六进制令牌，用于 GET /oauth/userinfo 与权限允许的 /me/… 接口"
                    example: "b7e1c9d2a3f40123456789abcdef0123456789abcdef4567"
                  token_type:
                    type: string
                    const: "Bearer"
                  scope:
                    $ref: "#/components/schemas/Scope"
                  user:
                    $ref: "#/components/schemas/OAuthUser"
        '400':
          description: |
            - `invalid_request`：请求体格式错误
            - `unsupported_grant_type`：`grant_type` 不是 `authorization_code`
            - `invalid_grant`：`code` 错误、过期或已用过，`redirect_uri` 与授权时不一致，或 `code_verifier` 不对
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_grant"
        '401':
          description: "`invalid_client`：`client_id` 未登记或已停用、密钥错误，或既没有密钥也没有使用 PKCE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_client"
        default:
          $ref: "#/components/responses/Error"

  /oauth/userinfo:
    get:
      tags: ["用星遇同频登录"]
      summary: "查询登录的玩家"
      operationId: oauthUserinfo
      description: |
        用 `POST /oauth/token` 拿到的令牌查询玩家，可用于确认玩家是否还连着、VRChat 名字是否有变化。**不需要 `X-Client`**，允许任何来源跨域调用。

        收到 `401 invalid_token` 时，说明玩家在「我的资料 → 第三方客户端」断开了你的网站，或网站已被停用：把这位玩家当作已登出。

        审核被撤回后，`vrc` 变为 `null`，`sub` 与 `star` 照常返回。
      security:
        - oauth: []
      responses:
        '200':
          description: "玩家信息"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthUser"
        '401':
          description: "令牌无效：玩家已断开该网站，或网站已停用（invalid_token）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                error: "invalid_token"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    client:
      type: apiKey
      in: header
      name: X-Client
      description: "已登记的客户端标识，或登记过的网站的 client_id（app_…）；开发自测阶段请使用 dev- 开头的标识（例如 dev-example）"
    clientQuery:
      type: apiKey
      in: query
      name: client
      description: "仅限开放数据接口：在无法设置请求头的环境（如 VRChat Udon）中，可将客户端标识放在 URL 查询参数 ?client="
    token:
      type: http
      scheme: bearer
      description: "设备授权（POST /device/token）或连接码（POST /connect）换取的 48 位十六进制令牌（仅限放入 Authorization 请求头，不可放入 URL）"
    clientBasic:
      type: http
      scheme: basic
      description: "用星遇同频登录：可用 HTTP Basic 传 client_id:client_secret（也可以放在请求体里）"
    oauth:
      type: oauth2
      description: "用星遇同频登录（授权码 + PKCE S256）。网站在「我的资料 → 第三方客户端 → 开发者 → 我登记的应用」自助登记获取 client_id 与 client_secret"
      flows:
        authorizationCode:
          authorizationUrl: "https://vrcc.cc/oauth/authorize"
          tokenUrl: "https://vrcc.cc/api/v1/oauth/token"
          scopes:
            profile: "识别你的登录身份，并读取你的星号（总会包含）"
            vrchat: "查看你的 VRChat 名字和 ID（验证过才提供）"
            card: "查看你的星卡（星群、介绍和成分）：GET /me/card"
            maps: "查看你在地图榜的评分和短评：GET /me/maps、GET /me/maps/{world}"
            maps.rate: "在你操作时，为地图打分：POST /me/maps/{world}/rating"
            notifications: "接收你的星遇同频提醒：GET /me/notifications、/me/notifications/recent"
            crossings: "查看你的「星轨相交」：GET /me/crossings"
            mutuals: "查看与你互相连上的星和他们的 VRChat 名字：GET /me/mutuals"
            today: "查看今天路过你的星（会看到其他玩家的资料）：GET /me/today"
            inbox: "查看连向你的星（会看到其他玩家的资料）：GET /me/inbox"
            link: "在你操作时，向其他星发起连线：POST /me/links"
            chat: "查看你的私聊（会看到对方发来的消息）：GET /me/chats、GET /me/chats/{n}"
            chat.send: "在你操作时，发送私聊消息：POST /me/chats/{n}"
            posts: "查看星友圈（会看到其他玩家的动态）：GET /me/posts"
            posts.write: "在你操作时，发布星友圈动态：POST /me/posts、评论、点亮、删除、合照"
            photos: "查看其他玩家的照片（互相连上后才是清晰的）：GET /me/stars/{n}/photo"
            maps.write: "在你操作时，写地图介绍、给短评点赞或踩、添加地图：POST /me/maps、/me/maps/{world}/intro、/me/map-votes"
            safety: "在你操作时，举报或隐藏其他玩家和内容：举报、隐藏、GET /me/hidden"

  responses:
    ClientError:
      description: "客户端标识缺失、未登记（不是登记名单里的标识、登记过的网站 client_id 或 dev- 开头）或已被停用（client_missing / client_unknown / client_off）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            missing:
              summary: "未携带 client 标识"
              value:
                error: "client_missing"
            unknown:
              summary: "标识未登记且非 dev- 开头"
              value:
                error: "client_unknown"
            off:
              summary: "该标识已被后台停用"
              value:
                error: "client_off"
    AuthError:
      description: "未携带有效的 Authorization: Bearer <令牌> 请求头（token）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "token"
    ScopeError:
      description: "令牌不是发给这个 X-Client 的（client_mismatch，先检查）；令牌没有这个接口要的权限（scope，need 写着缺哪个；要用就让玩家重新授权并要上它）；或敏感权限所属的应用未审核 / 审核被撤回（scope_unreviewed，附 need）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            scope:
              summary: "缺少权限"
              value:
                error: "scope"
                need: "card"
            mismatch:
              summary: "令牌和 X-Client 不匹配"
              value:
                error: "client_mismatch"
            unreviewed:
              summary: "敏感权限未审核或审核被撤回"
              value:
                error: "scope_unreviewed"
                need: "chat"
    GoneError:
      description: "令牌已失效（玩家已断开、同一客户端再次授权、或删除了星），请停止请求并让玩家重新授权（gone）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "gone"
    RateLimitError:
      description: "请求过于频繁或今日额度已用完（too_many、too_soon、quota 等），按 Retry-After 的秒数等到点再试"
      headers:
        Retry-After:
          description: "多少秒后再试：每分钟的限制 60；too_soon 是 25 秒间隔还剩的；quota 到下一轮；其余每天的次数到北京时间零点"
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error: "too_many"
    Error:
      description: "错误响应"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    World:
      type: string
      pattern: "^wrld_[0-9a-f-]{36}$"
      description: "VRChat 世界 ID（wrld_ 加 UUID）"
      example: "wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    Need:
      type: [string, "null"]
      enum: ["verify", "friend", "go", null]
      description: |
        打分前置条件缺失原因：
        - `verify`：需要先在星遇同频验证 VRChat 账号
        - `friend`：需要先在 VRChat 中同意机器人「VRCC的小助手」的好友请求
        - `go`：需要先在这张地图里待一会儿（让机器人看到你在场，或有过到访记录）
        - `null`：已满足条件

    Group:
      type: string
      enum: ["G", "W", "Z", "L", "A"]
      description: |
        所属星群代号：
        - `G`：漫游（观景 / 探索 / 拍照）
        - `W`：游戏（桌游 / 竞技 / 合作）
        - `Z`：创作（建模 / 改模 / 开发）
        - `L`：聊天（陪伴 / 挂机 / 谈心）
        - `A`：万象（多面兼顾）
      example: "G"

    Me:
      type: object
      required: [star, vrc]
      properties:
        star:
          type: [integer, "null"]
          description: "玩家在 /light/ 的点亮编号（无编号时为 null）"
          example: 128
        vrc:
          type: [string, "null"]
          description: "玩家当前登记的 VRChat 名字（device/token 只在有 vrchat 权限时给；第三方客户端用 connect 时为 null）"
          example: "MyVRCName"

    Scope:
      type: string
      description: |
        空格分隔的权限（请求时也接受逗号或 `+`），返回时按固定顺序、`profile` 在最前：
        `profile` `vrchat` `card` `maps` `maps.rate` `notifications` `crossings` `mutuals` `today` `inbox` `link` `chat` `chat.send` `posts` `posts.write` `photos` `maps.write` `safety`。
        敏感权限（`vrchat` `maps.rate` `crossings` `mutuals` `today` `inbox` `link` `chat` `chat.send` `posts` `posts.write` `photos` `maps.write` `safety`）只给开 Issue 登记的客户端与审核通过的应用（未审核的应用只有登记人能同意）；`dev-` 只能要普通权限。省略时：登记客户端为 `profile notifications crossings mutuals maps maps.rate`，`dev-` 为 `profile notifications maps`，自助登记的应用只有 `profile`。
      example: "profile notifications maps maps.rate"

    Card:
      type: object
      required: [n, star, name, line, group, groupName, vibe, scores, intro]
      properties:
        n:
          type: integer
          description: "玩家自己的星编号（和其他星卡的 n 一样）；me/stars/{n}/photo 用它拿自己的清晰照片"
          example: 77
        star:
          type: [integer, "null"]
          description: "/light/ 点亮编号（没有时为 null）"
          example: 128
        name:
          type: string
          description: "星位名称"
          example: "拾光旅人"
        line:
          type: string
          description: "星位的一句话描述"
          example: "放慢脚步逛世界，在角落拍下别人没注意到的光。"
        group:
          $ref: "#/components/schemas/Group"
        groupName:
          type: string
          description: "星群名称"
          example: "漫游星群"
        vibe:
          type: string
          enum: ["安静", "随场", "热闹"]
          deprecated: true
          description: "氛围。已弃用：网页的星卡上不显示，2026-12-26 起不再返回"
          example: "安静"
        scores:
          type: object
          description: "四个星群的成分（0–100）"
          required: [G, W, Z, L]
          properties:
            G:
              type: integer
              example: 82
            W:
              type: integer
              example: 40
            Z:
              type: integer
              example: 35
            L:
              type: integer
              example: 61
        intro:
          type: [string, "null"]
          description: "星卡介绍；还在生成中时为 null"
          example: "平时喜欢在安静的世界拍照、听音乐。"
        verified:
          type: boolean
          description: "有没有验证过 VRChat 账号（只要普通权限；账号本身要 vrchat）"
          example: true
        deco:
          $ref: "#/components/schemas/Deco"

    MyRating:
      type: object
      required: [world, name, score, words, wordsOk, at, page]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: [string, "null"]
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        score:
          type: integer
          minimum: 1
          maximum: 10
          description: "我打的分"
          example: 9
        words:
          type: [string, "null"]
          description: "我写的短评（没写时为 null）"
          example: "光影很舒服，适合安静聊天"
        wordsOk:
          type: [string, "null"]
          enum: ["wait", "ok", "hidden", null]
          description: "短评审核状态：wait 审核中、ok 已通过、hidden 未通过；没写短评时为 null"
          example: "ok"
        at:
          type: integer
          description: "打分时间（毫秒时间戳）"
          example: 1792830000000
        page:
          type: string
          description: "该地图在地图榜上的详情页"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    StarCard:
      type: object
      additionalProperties: true
      description: "与网页一致的星卡（这里只列主要字段，其余字段跟网页一致）"
      properties:
        n:
          type: integer
          description: "星的编号，连线、私聊都用它"
          example: 77
        name:
          type: string
          example: "拾光旅人"
        line:
          type: string
        group:
          $ref: "#/components/schemas/Group"
        groupName:
          type: string
          example: "漫游星群"
        vibe:
          type: string
          deprecated: true
          description: "氛围。已弃用：网页的星卡上不显示，2026-12-26 起不再返回"
          example: "安静"
        intro:
          type: string
        about:
          type: array
          description: "关于我的问答"
          items:
            type: object
            properties:
              q:
                type: string
              a:
                type: string
        star:
          type: [integer, "null"]
          description: "点亮编号（对方没公开时为 null）"
        verified:
          type: boolean
          description: "对方验证过 VRChat 账号"
        scores:
          type: [object, "null"]
          description: "四个星群的成分"
        linked:
          type: boolean
          description: "我连向了 TA"
        mutual:
          type: boolean
          description: "已经互相连上"
        vrc:
          type: string
          description: "对方的 VRChat 名字，只在互相连上时才有"
        vrcUser:
          type: string
          description: "对方的 VRChat 用户 ID，只在互相连上且对方公开已验证时才有"
        friends:
          type: [integer, "null"]
          description: "共同的星友数（对方不公开时为 null）"
        deco:
          $ref: "#/components/schemas/Deco"

    Deco:
      type: [object, "null"]
      description: "星卡的装扮；没装扮时为 null。卡面、卡套、卡背只给 id"
      properties:
        face: { type: string, example: "polaroid" }
        sleeve: { type: string, example: "holo" }
        back: { type: string, example: "airmail" }
        spots:
          type: array
          description: "卡面上的贴纸：[位置号, 贴纸, 材质, 磨损 0–5, 种子, 摆放]；摆放是 [x %, y %, 宽度 %, 旋转 °]，中心点、按卡宽和卡高（高 = 宽 × 4/3），早期贴纸没有摆放"
          items: { type: array }
          example: [[0, "cat", "holo", 1.25, 4321, [30, 40, 22, -8]]]

    Peer:
      type: object
      additionalProperties: true
      description: "对方（私聊、动态里的人）"
      properties:
        n:
          type: integer
          example: 77
        name:
          type: string
          example: "拾光旅人"
        group:
          $ref: "#/components/schemas/Group"
        photo:
          type: boolean
        mutual:
          type: boolean
        vrc:
          type: string
          description: "互相连上时对方的 VRChat 名字"

    Msg:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          example: 501
        text:
          type: string
          example: "你好"
        at:
          type: integer
          example: 1792830000000
        kind:
          type: string
          example: "chat"
        mine:
          type: boolean
          description: "是不是我发的"
        check:
          type: string
          enum: ["wait", "ok", "hidden"]
          description: "只在自己发的上面：wait 检查中、ok 通过、hidden 没通过"

    Post:
      type: object
      additionalProperties: true
      description: "星友圈动态（这里只列主要字段，其余字段跟网页一致）"
      properties:
        id:
          type: integer
        kind:
          type: string
          description: "text、截图等；官方动态为 official"
        text:
          type: string
        vis:
          type: string
          enum: ["all", "mutual"]
        at:
          type: integer
        mine:
          type: boolean
        check:
          type: string
          description: "只在自己的上面：wait 检查中、ok 通过、hidden 没通过或已撤下"
        img:
          type: [object, "null"]
        lit:
          type: integer
          description: "点亮数"
        cmts:
          type: integer
          description: "评论数"

    DeviceCode:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval, scope]
      properties:
        device_code:
          type: string
          pattern: "^[0-9a-f]{48}$"
          description: "48 位十六进制设备码，客户端自己保存，用于 POST /device/token，不要展示给玩家"
          example: "9f2c4e1a7b3d5f6081726354a0b1c2d3e4f5a6b7c8d9e0f1"
        user_code:
          type: string
          pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"
          description: "展示给玩家的码，玩家可在「我的资料 → 第三方客户端」手动输入"
          example: "ABCD-2345"
        verification_uri:
          type: string
          description: "玩家手动输入码的页面"
          example: "https://vrcc.cc/match/?connect"
        verification_uri_complete:
          type: string
          description: "已带上码的同意链接，在浏览器中打开即可"
          example: "https://vrcc.cc/match/?connect=ABCD2345"
        expires_in:
          type: integer
          description: "有效秒数"
          example: 600
        interval:
          type: integer
          description: "调用 POST /device/token 的间隔秒数"
          example: 5
        scope:
          $ref: "#/components/schemas/Scope"

    OAuthTokenRequest:
      type: object
      required: [grant_type, code, redirect_uri, client_id]
      properties:
        grant_type:
          type: string
          const: "authorization_code"
        code:
          type: string
          pattern: "^[0-9a-f]{48}$"
          description: "回调中带回的授权码（5 分钟内有效，只能用一次）"
        redirect_uri:
          type: string
          description: "与授权时完全一致的回调地址"
          example: "https://example.com/callback"
        client_id:
          type: string
          pattern: "^app_[0-9a-f]{16}$"
          example: "app_0123456789abcdef"
        client_secret:
          type: string
          pattern: "^sec_[0-9a-f]{48}$"
          description: "网站密钥（只在服务器上使用）；也可以改用 HTTP Basic"
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: "PKCE 原文；授权时带了 code_challenge 的必须提供"

    OAuthUser:
      type: object
      required: [sub, star, vrc]
      properties:
        sub:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: "该玩家在本网站的编号（固定不变，不同网站拿到的不同），请用它作为账号主键"
          example: "3f9a1c7e5b2d4f6081a2b3c4d5e6f708"
        star:
          type: [integer, "null"]
          description: "玩家在 /light/ 的星号（没有时为 null）"
          example: 128
        vrc:
          description: "只在有 vrchat 权限、且玩家在星遇同频验证过 VRChat 账号时返回，否则为 null"
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  description: "VRChat 用户 ID"
                  example: "usr_01234567-89ab-cdef-0123-456789abcdef"
                name:
                  type: [string, "null"]
                  description: "VRChat 显示名"
                  example: "MyVRCName"
            - type: "null"

    Notice:
      type: object
      required: [id, title, body, at]
      properties:
        id:
          type: integer
          description: "提醒递增编号"
          example: 1042
        title:
          type: string
          description: "提醒标题"
          example: "星遇同频"
        body:
          type: string
          description: "提醒正文"
          example: "有人连向了你"
        at:
          type: integer
          description: "产生时间（毫秒时间戳）"
          example: 1792830000000

    BoardMap:
      type: object
      required: [world, name, author, avg, raters, rank, weight, page, img]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: string
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        author:
          type: [string, "null"]
          description: "地图作者名称"
          example: "Shiori"
        avg:
          type: [number, "null"]
          description: "1–10 分的平均分（保留一位小数，无人评分时为 null）"
          example: 9.2
        raters:
          type: integer
          description: "评分人数"
          example: 18
        rank:
          type: [integer, "null"]
          description: "总榜名次（还没人评分时为 null）"
          example: 1
        weight:
          type: [string, "null"]
          enum: ["light", "mid", "heavy", null]
          description: "多小咕实测性能档位：light 轻量、mid 中等、heavy 较重，未测过为 null"
          example: "light"
        page:
          type: string
          description: "该地图在星遇同频地图榜上的详情页网址"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"
        img:
          type: [string, "null"]
          description: "地图封面图网址"
          example: "https://vrcc.cc/maps/wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd.jpg"
        hot:
          description: "热评：这张图最热的一条短评，署名「某位<星位>」，没有时为 null"
          oneOf:
            - type: object
              properties:
                text: { type: string, example: "光影很舒服" }
                by: { type: string, example: "某位彩蛋猎人" }
                up: { type: integer, description: "赞的数量", example: 3 }
                went: { type: boolean, description: "写的人去过这张图" }
            - type: "null"

    MyMap:
      type: object
      required: [world, name, board, pending, off, avg, raters, mine, can, need, words, wordsOk, img]
      properties:
        world:
          $ref: "#/components/schemas/World"
        name:
          type: [string, "null"]
          description: "地图名称"
          example: "星夜茶屋 Starry Tea House"
        board:
          type: boolean
          description: "是否已正式在地图榜上展示"
          example: true
        pending:
          type: boolean
          description: "是否已提交收录、正在等待审核"
          example: false
        off:
          type: boolean
          description: "是否不给当前玩家看（为 true 时客户端应隐藏此地图卡片）"
          example: false
        avg:
          type: [number, "null"]
          description: "当前平均分（1–10，一位小数）"
          example: 9.2
        raters:
          type: integer
          description: "当前评分人数"
          example: 18
        mine:
          type: [integer, "null"]
          description: "我打过的分数（1–10，未打分时为 null）"
          example: 9
        can:
          type: boolean
          deprecated: true
          description: "已弃用：2026-10-24 起谁都能打分，恒为 true。2026-12-26 起不再返回"
          example: true
        need:
          deprecated: true
          description: "已弃用：恒为 null。2026-12-26 起不再返回"
          allOf:
            - $ref: "#/components/schemas/Need"
        words:
          type: [string, "null"]
          description: "我写的短评（未写时为 null）"
          example: "光影很舒服，适合安静聊天"
        wordsOk:
          type: [string, "null"]
          enum: ["wait", "ok", "hidden", null]
          description: "我的短评审核状态：wait 审核中、ok 已通过、hidden 未通过、无短评时为 null"
          example: "ok"
        img:
          type: [string, "null"]
          description: "封面相对路径（接在 https://vrcc.cc 后面使用），无封面或不可见时为 null"
          example: "/api/match?xdimg=wrld_4432ea9b-729c-46e3-8eaf-846aa0a37fdd"

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            机器可读的错误码：
            - `client_missing` (403)：未携带 `client` 标识
            - `client_unknown` (403)：`client` 不在登记名单中，不是登记过的应用的 `client_id`，也非 `dev-` 开头
            - `client_off` (403)：该 `client` 标识已被停用
            - `token` (401)：未携带或格式错误的 `Authorization: Bearer` 令牌
            - `scope` (403)：令牌没有该接口要的权限（附带 `need`）
            - `scope_unreviewed` (403)：敏感权限要审核：`dev-` 要了敏感权限、未审核应用由非登记人同意、或审核被撤回（附带 `need`）
            - `invalid_scope` (400)：设备授权的 `scope` 中有不认识的权限
            - `client_mismatch` (403)：令牌不是发给这个 `X-Client` 的
            - `gone` (404)：令牌已失效（断开、被新连接顶掉、星已删除）
            - `star_gone` (404)：网页上的动作里，连线或私聊的对方不在了（令牌没事）
            - `expired` (404)：签名图片链接失效（令牌没事，重新请求列表拿新链接）
            - `code` (404)：连接码错误、过期或已使用
            - `not_found` (404)：接口不存在或地图不在榜上
            - `too_many` (429)：超出频率或每日次数限制（含每个令牌每天的读、连线、私聊、发动态上限）
            - `not_offered` (403) / `quota` / `fof_day` / `yq_link_day` / `cross_link_day` (429) / `yq_gone` (404) / `bad_target` (400)：连线不被允许或次数用完
            - `msg_not_mutual` (403)：私聊只能和互相连上的人
            - `msg_words` (400，附 `why`) / `msg_empty` (400)：私聊文字没过检查或为空
            - `too_soon` (429)：提醒轮询间隔不足 25 秒（附带 `every`）
            - `busy` (429)：全站今日错误连接码过多，连接功能暂停至次日
            - `map_gone` (404)：那条短评或介绍不在了
            - `map_wait` (409)：地图还在审核
            - `yq_off` (404)：星友圈（含地图榜）整体关着
            - `yq_gone` (404)：那条动态或评论不在了
            - `yq_wait` / `yq_paused` (409)：玩家自己的星还在审核 / 被下架时不能发言、打分
            - `msg_wait` / `msg_paused` (409)：同上，私聊和说一句
            - `say_mutual` / `said` (409)：说一句：已经互相连上（去私聊）/ 已经说过
            - `xd_world` (400 / 404)：地图 ID 格式不对 / VRChat 上没有这张图
            - `xd_search` (502)：去 VRChat 查地图失败，稍后再试
            - `busy` (409)：星卡还在生成（今天的星）
            - `method` (405)：用了 GET、POST 以外的方法
            - `server` / `server_error` (500)：服务器出错
            - `stop` (503)：停站维护中，附带 `say`（说明）和 `until`（预计恢复，毫秒），只出现在网页上的动作；令牌没事
            - （`map_not_went`、`map_elsewhere` 从 2026-10-24 起不再返回）
            - `map_off` / `xd_world_no` (403)：该地图不允许打分或不对该玩家开放
            - `yq_words` (400)：短评未通过关键词检查（附带 `why`）
            - `yq_empty` (400)：短评仅含符号或空白
            - `bad_request` (400)：请求体或参数格式错误
            - `too_large` (413)：请求体超过 2 KB
            - `authorization_pending` (400)：设备授权，玩家还没点「同意连接」
            - `access_denied` (400)：设备授权，玩家点了「取消」
            - `expired_token` (400)：设备授权，设备码过期、已换过令牌、客户端不一致或不存在
            - `invalid_request` / `unsupported_grant_type` / `invalid_grant` (400)：用星遇同频登录，换令牌请求有误
            - `invalid_client` (401)：用星遇同频登录，网站未登记 / 已停用、密钥错误或缺少密钥与 PKCE
            - `invalid_token` (401)：用星遇同频登录，玩家已断开该网站或网站已停用
        every:
          type: integer
          description: "too_soon 时返回，建议多少秒后再试"
        need:
          type: string
          description: "scope、scope_unreviewed 时为缺少的权限"
          example: "go"
        why:
          type: string
          description: "yq_words 时返回，短评未通过的原因"
